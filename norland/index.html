<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Norland Place Parents</title>
<meta name="description" content="Everything a Norland Place parent needs, in one place: what is on today, what to wear, what is after school, and the same for any day, week or term.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Norland Place">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#4A6B96">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-512.png" sizes="512x512" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Norland Place Parents: a prototype
   Design notes: drawn from the school's own identity. Crest navy on a
   cool white ground, a slate blue utility strip, and a wide letterspaced
   geometric sans (Poppins, standing in for the school's wordmark face)
   for headings and labels, with Inter carrying dense text. Red is kept
   back as a semantic colour for anything overdue, not a brand accent.
   Founded 1876; 2026 is the school's 150th year.
   ============================================================ */
:root{
  --paper:#F1F4F8;
  --paper-2:#E4EAF1;
  --card:#FFFFFF;
  --ink:#34506E;
  --on-ink:#FFFFFF;
  --ink-2:#4A6484;
  --muted:#657A94;
  --faint:#93A3B6;
  --line:#DAE2EB;
  --line-2:#E9EEF4;
  --slate:#4A6B96;
  --red:#B0323A;
  --red-soft:#F8E7E8;
  --gold:#A8894F;
  --green:#2F7D5E;
  --green-soft:#E3F0EA;
  --sky:#44618A;
  --sky-soft:#E5EBF3;
  --plum:#6A5A86;
  --shadow:0 1px 2px rgba(52,80,110,.07), 0 6px 18px rgba(52,80,110,.06);
  --radius:14px;
  --display:'Poppins', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
  --sans:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .crest{filter:brightness(0) invert(1);opacity:.92;}
  :root:not([data-theme="light"]){
    --paper:#0E1A2A; --paper-2:#091320; --card:#16253A; --ink:#E9EFF6; --on-ink:#0E1A2A; --ink-2:#C5D3E2;
    --muted:#91A3B9; --faint:#6F819B; --line:#26374F; --line-2:#1D2C41; --slate:#2E4A73;
    --red:#E4838A; --red-soft:#3A2127; --gold:#C6A468; --green:#6FB394; --green-soft:#152D25;
    --sky:#8FAFD6; --sky-soft:#1A2A3E; --plum:#AE9BC9;
    --shadow:0 1px 2px rgba(0,0,0,.34), 0 6px 18px rgba(0,0,0,.28);
  }
}
:root[data-theme="dark"]{
  --paper:#0E1A2A; --paper-2:#091320; --card:#16253A; --ink:#E9EFF6; --on-ink:#0E1A2A; --ink-2:#C5D3E2;
    --muted:#91A3B9; --faint:#6F819B; --line:#26374F; --line-2:#1D2C41; --slate:#2E4A73;
    --red:#E4838A; --red-soft:#3A2127; --gold:#C6A468; --green:#6FB394; --green-soft:#152D25;
    --sky:#8FAFD6; --sky-soft:#1A2A3E; --plum:#AE9BC9;
    --shadow:0 1px 2px rgba(0,0,0,.34), 0 6px 18px rgba(0,0,0,.28);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
[hidden]{display:none!important;}
/* these are spans used as blocks so that buttons may contain them */
.child-band .who .nm,.child-band .who .mt,
.row .v .note,.line .bd .t,.line .bd .m,
.action-line .bd .t,.action-line .bd .m,
.notice .bd .t,.notice .bd .m,.notice .bd .x,
.idx .bd .t,.idx .bd .m,
.statgrid .s .l,.month .cell .n{display:block;}
html{-webkit-text-size-adjust:100%;}
body{
  font-family:var(--sans);
  color:var(--ink);
  background:var(--paper);
  font-size:15px;line-height:1.5;
  min-height:100vh;
  padding-bottom:calc(74px + env(safe-area-inset-bottom));
}
button,input,select,textarea{font:inherit;color:inherit;}
button{background:none;border:0;cursor:pointer;}
a{color:var(--sky);}

/* ---------- Shell ---------- */
.wrap{max-width:600px;margin:0 auto;padding:0 16px;}
.topbar{
  position:sticky;top:0;z-index:40;
  background:var(--card);color:var(--ink);
  border-bottom:1px solid var(--line);
}
/* the school's own header carries a slate strip above the crest; here it
   states the term and the week, which is what parents ask most often */
.utility{background:var(--slate);color:#fff;padding-top:env(safe-area-inset-top);}
.utility .inner{max-width:600px;margin:0 auto;padding:6px 16px;display:flex;gap:14px;
  font-family:var(--display);font-size:.61rem;letter-spacing:.16em;text-transform:uppercase;font-weight:400;}
.utility .inner .r{margin-left:auto;opacity:.8;white-space:nowrap;}
.topbar .inner{max-width:600px;margin:0 auto;padding:11px 16px 10px;display:flex;align-items:center;gap:11px;}
.crest{width:34px;height:36px;flex:0 0 34px;display:block;object-fit:contain;}
.wordmark{flex:1;min-width:0;}
.wordmark .n{font-family:var(--display);font-weight:600;font-size:.94rem;letter-spacing:.02em;
  text-transform:uppercase;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.wordmark .s{font-family:var(--display);font-weight:300;font-size:.72rem;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ink);opacity:.78;line-height:1.15;margin-top:1px;}
.iconbtn{
  width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:0 0 36px;
  color:var(--ink);border:1px solid var(--line);
}
.iconbtn:hover{background:var(--paper-2);}
:root[data-theme="dark"] .crest{filter:brightness(0) invert(1);opacity:.92;}

/* ---------- Child filter ---------- */
.chips{display:flex;gap:7px;overflow-x:auto;padding:12px 16px 2px;max-width:600px;margin:0 auto;scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.chip{
  border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:999px;padding:6px 13px;font-size:.83rem;font-weight:500;white-space:nowrap;
  display:flex;align-items:center;gap:7px;
}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink);}
.chip .pip{width:8px;height:8px;border-radius:50%;flex:0 0 8px;}

/* ---------- Typography ---------- */
h1,h2,h3{font-family:var(--display);font-weight:500;letter-spacing:-.2px;line-height:1.25;}
.page-h{padding:16px 0 2px;}
.page-h h1{font-size:1.5rem;}
.page-h .sub{color:var(--muted);font-size:.86rem;margin-top:3px;}
.rubric{
  font-family:var(--display);font-size:.67rem;letter-spacing:.17em;text-transform:uppercase;
  color:var(--muted);font-weight:500;margin:22px 0 9px;display:flex;align-items:center;gap:10px;
}
.rubric::after{content:'';flex:1;height:1px;background:var(--line);}
.display{font-family:var(--display);}

/* ---------- Cards ---------- */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px;
}
.card.flat{box-shadow:none;}
.card-pad{padding:14px 15px;}
.card-head{
  padding:12px 15px;border-bottom:1px solid var(--line-2);
  display:flex;align-items:center;gap:10px;
}
.card-head h2{font-size:1.05rem;flex:1;min-width:0;}
.card-head .tag{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;}

/* child card header band */
.child-band{display:flex;align-items:center;gap:11px;padding:13px 15px;border-bottom:1px solid var(--line-2);}
.avatar{
  width:38px;height:38px;border-radius:50%;flex:0 0 38px;display:grid;place-items:center;
  font-family:var(--display);font-weight:600;font-size:1rem;color:#fff;letter-spacing:.3px;
}
.child-band .who{flex:1;min-width:0;}
.child-band .who .nm{font-family:var(--display);font-size:1.1rem;font-weight:600;}
.child-band .who .mt{font-size:.78rem;color:var(--muted);}
.linkish{font-size:.78rem;color:var(--sky);font-weight:600;white-space:nowrap;}

/* definition rows */
.rows{display:flex;flex-direction:column;}
.row{display:flex;gap:12px;padding:11px 15px;border-bottom:1px solid var(--line-2);align-items:flex-start;}
.row:last-child{border-bottom:0;}
.row.as-btn{width:100%;text-align:left;align-items:center;}
.row.as-btn:active{background:var(--paper-2);}
.row .k{
  flex:0 0 84px;font-size:.68rem;letter-spacing:.11em;text-transform:uppercase;
  color:var(--faint);font-weight:600;padding-top:2px;
}
.row .v{flex:1;min-width:0;font-size:.92rem;}
.row .v .note{color:var(--muted);font-size:.83rem;margin-top:2px;}
.row .v strong{font-weight:600;}

/* lists */
.line{display:flex;gap:11px;padding:11px 15px;border-bottom:1px solid var(--line-2);align-items:flex-start;text-align:left;width:100%;}
.line:last-child{border-bottom:0;}
.line .tm{flex:0 0 52px;font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600;padding-top:1px;}
.line .bd{flex:1;min-width:0;}
.line .bd .t{font-size:.92rem;font-weight:500;}
.line .bd .m{font-size:.8rem;color:var(--muted);margin-top:1px;}
.line .rail{width:3px;border-radius:2px;align-self:stretch;flex:0 0 3px;}
.line.tappable:active{background:var(--paper-2);}

/* pills */
.pill{
  display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;
  font-size:.7rem;font-weight:600;letter-spacing:.02em;white-space:nowrap;
}
.pill.red{background:var(--red-soft);color:var(--red);}
.pill.green{background:var(--green-soft);color:var(--green);}
.pill.sky{background:var(--sky-soft);color:var(--sky);}
.pill.plain{background:var(--paper-2);color:var(--muted);}

/* action strip */
.action-card{border-color:var(--red);background:var(--card);}
.action-card .card-head{background:var(--red-soft);border-bottom-color:transparent;}
.action-card .card-head h2{color:var(--red);}
.action-line{display:flex;gap:11px;align-items:center;padding:11px 15px;border-bottom:1px solid var(--line-2);width:100%;text-align:left;}
.action-line:last-child{border-bottom:0;}
.action-line .bd{flex:1;min-width:0;}
.action-line .bd .t{font-size:.9rem;font-weight:500;}
.action-line .bd .m{font-size:.78rem;color:var(--muted);margin-top:1px;}
.chev{color:var(--faint);flex:0 0 auto;}

/* buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;
  border-radius:10px;padding:11px 16px;font-size:.9rem;font-weight:600;
  border:1px solid var(--ink);background:var(--ink);color:var(--on-ink);
}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line);}
.btn.red{background:var(--red);border-color:var(--red);color:var(--on-ink);}
.btn.wide{width:100%;}
.btn.sm{padding:8px 13px;font-size:.83rem;border-radius:9px;}
.btn[disabled]{opacity:.45;}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;padding:13px 15px;}

/* segmented */
.seg{display:flex;background:var(--paper-2);border-radius:10px;padding:3px;gap:2px;}
.seg button{
  flex:1;padding:7px 4px;border-radius:8px;font-size:.82rem;font-weight:600;color:var(--muted);
}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(22,36,63,.12);}

/* date bar */
.datebar{display:flex;align-items:center;gap:8px;margin:12px 0;}
.datebar .nav{width:34px;height:34px;border:1px solid var(--line);border-radius:9px;display:grid;place-items:center;background:var(--card);color:var(--ink);flex:0 0 34px;}
.datebar .lbl{flex:1;text-align:center;font-family:var(--display);font-weight:600;font-size:1.02rem;}
.datebar .lbl small{display:block;font-family:var(--sans);font-weight:500;font-size:.72rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;}

/* month grid */
.month{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:9px;box-shadow:var(--shadow);}
.month .dow{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px;}
.month .dow span{text-align:center;font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:600;}
.month .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.month .cell{
  aspect-ratio:1/1.12;border-radius:9px;display:flex;flex-direction:column;align-items:center;
  justify-content:flex-start;padding-top:5px;gap:3px;font-size:.82rem;color:var(--ink);position:relative;
}
.month .cell.out{color:var(--faint);opacity:.5;}
.month .cell.today{background:var(--ink);color:var(--on-ink);font-weight:600;}
.month .cell.sel{box-shadow:inset 0 0 0 1.5px var(--ink);}
.month .cell.hol{background:var(--paper-2);}
.month .cell.hol .n{color:var(--faint);}
.month .dots{display:flex;gap:2px;height:5px;}
.month .dots i{width:4px;height:4px;border-radius:50%;display:block;}

/* week columns (desktop) */
.weekgrid{display:flex;flex-direction:column;gap:10px;}
.daycol{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
.daycol .dh{padding:9px 14px;background:var(--paper-2);border-bottom:1px solid var(--line-2);display:flex;align-items:baseline;gap:8px;}
.daycol .dh .d{font-family:var(--display);font-weight:600;font-size:.98rem;}
.daycol .dh .n{font-size:.76rem;color:var(--muted);}
.daycol.is-today .dh{background:var(--ink);}
.daycol.is-today .dh .d{color:var(--on-ink);}
.daycol.is-today .dh .n{color:var(--on-ink);opacity:.72;}

/* empty */
.empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:.88rem;}
.empty .big{font-family:var(--display);font-size:1.05rem;color:var(--ink);margin-bottom:4px;}

/* notices */
.notice{display:flex;gap:11px;padding:13px 15px;border-bottom:1px solid var(--line-2);width:100%;text-align:left;align-items:flex-start;}
.notice:last-child{border-bottom:0;}
.notice .unread{width:7px;height:7px;border-radius:50%;background:var(--red);flex:0 0 7px;margin-top:7px;}
.notice .unread.read{background:transparent;}
.notice .bd{flex:1;min-width:0;}
.notice .bd .t{font-family:var(--display);font-size:1rem;font-weight:600;line-height:1.3;}
.notice .bd .m{font-size:.79rem;color:var(--muted);margin-top:3px;}
.notice .bd .x{font-size:.85rem;color:var(--ink-2);margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.notice .bd .tags{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap;}

/* school index */
.idx{display:flex;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line-2);width:100%;text-align:left;align-items:center;}
.idx:last-child{border-bottom:0;}
.idx .ic{width:30px;height:30px;border-radius:8px;background:var(--paper-2);display:grid;place-items:center;flex:0 0 30px;font-size:.95rem;}
.idx .bd{flex:1;min-width:0;}
.idx .bd .t{font-size:.94rem;font-weight:500;}
.idx .bd .m{font-size:.78rem;color:var(--muted);margin-top:1px;}

/* prose */
.prose{padding:2px 15px 15px;font-size:.93rem;color:var(--ink-2);}
.prose p{margin:11px 0;}
.prose h3{font-size:1rem;margin:18px 0 6px;color:var(--ink);}
.prose ul{margin:10px 0 10px 18px;}
.prose li{margin:5px 0;}
.prose table{width:100%;border-collapse:collapse;margin:12px 0;font-size:.88rem;}
.prose th,.prose td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line-2);vertical-align:top;}
.prose th{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:600;}
.tablewrap{overflow-x:auto;}

/* toggles */
.tog{width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;flex:0 0 44px;transition:background .15s;}
.tog::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s;}
.tog[aria-pressed="true"]{background:var(--green);}
.tog[aria-pressed="true"]::after{transform:translateX(18px);}

/* uniform check */
.chk{display:flex;gap:12px;padding:12px 15px;border-bottom:1px solid var(--line-2);width:100%;text-align:left;align-items:flex-start;}
.chk:last-child{border-bottom:0;}
.chk .box{
  width:22px;height:22px;flex:0 0 22px;border-radius:6px;border:1.5px solid var(--line);
  display:grid;place-items:center;margin-top:1px;color:transparent;background:var(--card);
}
.chk[aria-pressed="true"] .box{background:var(--green);border-color:var(--green);color:#fff;}
.chk .bd{flex:1;min-width:0;}
.chk .bd .t{display:block;font-size:.93rem;}
.chk .bd .n{display:block;font-size:.79rem;color:var(--muted);margin-top:2px;}
.chk[aria-pressed="true"] .bd .t{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px;}
.prog{display:flex;align-items:center;gap:11px;padding:13px 15px;}
.prog .bar{flex:1;height:6px;border-radius:3px;background:var(--paper-2);overflow:hidden;}
.prog .bar i{display:block;height:100%;background:var(--green);border-radius:3px;transition:width .2s;}
.prog .n{font-size:.8rem;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;}
.prog.done .n{color:var(--green);}
.banner{display:flex;gap:11px;padding:12px 15px;border-bottom:1px solid var(--line-2);align-items:flex-start;}
.banner:last-child{border-bottom:0;}
.banner .dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px;margin-top:7px;}
.banner .t{display:block;font-weight:600;font-size:.9rem;}
.banner .m{display:block;font-size:.84rem;color:var(--ink-2);margin-top:2px;}
.banner.red .dot{background:var(--red);} .banner.red .t{color:var(--red);}
.banner.amber .dot{background:var(--gold);} .banner.amber .t{color:var(--gold);}
.backlink{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;color:var(--muted);font-weight:500;padding:14px 0 0;}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(15,22,38,.42);z-index:60;opacity:0;transition:opacity .18s;}
.scrim.on{opacity:1;}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--paper);
  border-radius:18px 18px 0 0;max-height:92vh;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .22s cubic-bezier(.32,.72,0,1);
  box-shadow:0 -8px 40px rgba(15,22,38,.22);
}
.sheet.on{transform:translateY(0);}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:9px auto 0;flex:0 0 auto;}
.sheet .sh{padding:10px 16px 10px;display:flex;align-items:flex-start;gap:10px;border-bottom:1px solid var(--line);}
.sheet .sh h2{flex:1;font-size:1.2rem;}
.sheet .sb{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 0 calc(20px + env(safe-area-inset-bottom));}
.sheet .sb .wrap{padding:0 16px;}
.closebtn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--paper-2);color:var(--muted);flex:0 0 30px;}

/* tabbar */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:color-mix(in srgb, var(--card) 92%, transparent);
  -webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.tabbar .inner{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);}
.tab{padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--faint);position:relative;}
.tab .lb{font-family:var(--display);font-size:.63rem;font-weight:500;letter-spacing:.05em;}
.tab[aria-current="page"]{color:var(--ink);}
.tab .badge{
  font-family:var(--sans);position:absolute;top:3px;right:50%;transform:translateX(19px);
  min-width:16px;height:16px;border-radius:999px;background:var(--red);color:var(--on-ink);
  font-size:.6rem;font-weight:700;display:grid;place-items:center;padding:0 4px;
}

/* search */
.searchbox{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:9px 12px;margin:12px 0;}
.searchbox input{flex:1;border:0;outline:0;background:transparent;font-size:.92rem;}
.searchbox input::placeholder{color:var(--faint);}

/* misc */

/* ============================================================

const $ = (s, r = document) => r.querySelector(s);
const pad = n => String(n).padStart(2, "0");
const key = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };

const sameDay = (a, b) => key(a) === key(b);
const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

const DAYNAMES = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

const dayShort = d => `${DOW[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()].slice(0, 3)}`;
const isWeekend = d => d.getDay() === 0 || d.getDay() === 6;

/* "Today" may be overridden with ?date=YYYY-MM-DD so the prototype can be walked
   through any point in the year. */
function resolveToday() {
  const q = new URLSearchParams(location.search).get("date");
  if (q && /^\d{4}-\d{2}-\d{2}$/.test(q)) { const [y, m, dd] = q.split("-").map(Number); return new Date(y, m - 1, dd); }
  const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate());
}
const TODAY = resolveToday();

/* ============================================================
   2. Term calendar
   Dates are generated from the academic year so the prototype stays
   live whenever it is opened. Illustrative, not the school's own.
   ============================================================ */
function nthDow(y, m, dow, n) {             // n-th given weekday of a month (1-based)
  const d = new Date(y, m, 1);
  d.setDate(1 + ((dow - d.getDay() + 7) % 7) + (n - 1) * 7);
  return d;
}
function lastDow(y, m, dow) {
  const d = new Date(y, m + 1, 0);
  d.setDate(d.getDate() - ((d.getDay() - dow + 7) % 7));
  return d;
}
function academicYear(d) { return d.getMonth() >= 7 ? d.getFullYear() : d.getFullYear() - 1; }

function buildTerms(ay) {
  const mich = {
    id: "michaelmas", name: "Michaelmas Term",
    start: nthDow(ay, 8, 4, 1),                      // first Thursday of September
    end:   nthDow(ay, 11, 5, 2),                     // second Friday of December
    hStart: lastDow(ay, 9, 1),                       // last Monday of October
  };
  mich.hEnd = addDays(mich.hStart, 4);
  const lent = {
    id: "lent", name: "Lent Term",
    start: (() => { const d = new Date(ay + 1, 0, 5); d.setDate(5 + ((2 - d.getDay() + 7) % 7)); return d; })(),
    end:   lastDow(ay + 1, 2, 5),                    // last Friday of March
    hStart: nthDow(ay + 1, 1, 1, 3),                 // third Monday of February
  };
  lent.hEnd = addDays(lent.hStart, 4);
  const summ = {
    id: "summer", name: "Summer Term",
    start: nthDow(ay + 1, 3, 2, 3),                  // third Tuesday of April
    end:   nthDow(ay + 1, 6, 3, 1),                  // first Wednesday of July
    hStart: lastDow(ay + 1, 4, 1),                   // last Monday of May
  };
  summ.hEnd = addDays(summ.hStart, 4);
  return [mich, lent, summ];
}
const AY = academicYear(TODAY);
const TERMS = buildTerms(AY);
const AY_LABEL = `${AY}/${String(AY + 1).slice(2)}`;

function termFor(d) {
  for (const t of TERMS) if (d >= t.start && d <= t.end) return t;
  return null;
}
function inHalfTerm(d) { const t = termFor(d); return !!t && d >= t.hStart && d <= t.hEnd; }
function isSchoolDay(d) { const t = termFor(d); return !!t && !isWeekend(d) && !inHalfTerm(d) && !INSET.has(key(d)); }

/* Week index within a term, skipping the half-term week. */
function termWeek(d) {
  const t = termFor(d); if (!t) return null;
  const a = startOfWeek(t.start), b = startOfWeek(d);
  let w = Math.round((b - a) / 604800000) + 1;
  if (b > startOfWeek(t.hStart)) w -= 1;
  return w;
}
/* Two INSET days: the two weekdays before each Michaelmas and Lent term start. */
const INSET = new Set(TERMS.flatMap(t => t.id === "summer" ? [] : [key(addDays(t.start, -1)), key(addDays(t.start, -2))]

  return { name: "the end of term", date: addDays(t.end, 1) };

  clubs: "Clubs", academic: "Academic", term: "Term", fixture: "Fixture", inset: "INSET", holiday: "Holiday"
};

/* All events for a given date, already filtered to relevance for a child set. */
function eventsFor(d, childIds) {
  const out = [];
  const k = key(d);
  const t = termFor(d);
  const kids = state.children.filter(c => childIds.includes(c.id));

  if (INSET.has(k)) { out.push({ t: "INSET day, school closed to pupils", type: "inset", allDay: true, scope: "school" }); return out; }
  if (!t) { out.push({ t: "School holiday", type: "holiday", allDay: true, scope: "school" }); return out; }
  if (inHalfTerm(d)) { out.push({ t: "Half term", type: "holiday", allDay: true, scope: "school" }); return out; }
  if (isWeekend(d)) return out;

  const w = termWeek(d), dc = dayCode(d);
  for (const e of (TERM_EVENTS[t.id] || [])) {
    if (e.w !== w || e.d !== dc) continue;
    if (e.years && !kids.some(c => e.years.includes(c.year))) continue;
    out.push({ ...e, scope: e.years ? "year" : "school", years: e.years });
  }
  /* Thursday fixtures for Year 4 */
  if (dc === "Thu" && kids.some(c => c.year === 4) && w >= 2) {
    const o = OPPONENTS[(w + t.id.length) % OPPONENTS.length];
    out.push({ t: `${SPORT_BY_TERM[t.id]} v ${o[0]}`, type: "fixture", time: "14:00", where: o[2],
      note: `${o[1]} fixture. Return to school by 16:15. Full ${SPORT_BY_TERM[t.id].toLowerCase()} kit and a water bottle.`,
      scope: "year", years: [4] });
  }
  /* After-school clubs */
  for (const c of kids) {
    const club = (CLUBS[c.id] || {})[dc];
    if (club && w >= 2) out.push({ t: club.name, type: "clubs", time: club.end, where: club.where,
      note: `Finishes at ${club.end}, collect from ${club.where}. Run by ${club.who}.`, scope: "child", child: c.id });
  }
  return out.sort((a, b) => (a.time || "08:00").localeCompare(b.time || "08:00"));
}

   ============================================================ */
function uniformBase(d) {
  const t = termFor(d);
  if (!t) return "Summer uniform";
  if (t.id === "michaelmas") return d < t.hStart ? "Summer uniform" : "Winter uniform";
  if (t.id === "lent") return "Winter uniform";
  return d < t.hStart ? "Winter uniform" : "Summer uniform";
}

function wearFor(child, d) {
  if (!isSchoolDay(d)) return null;
  const p = patternFor(child, d);
  const base = uniformBase(d);
  const overrides = [];
  for (const e of eventsFor(d, [child.id])) {
    if (/photograph/i.test(e.t)) overrides.push("School photographs today: full uniform with blazer. Games kit in a bag, not worn.");
    if (/mufti/i.test(e.t)) overrides.push("Mufti Day: own clothes, sensible shoes. No uniform needed.");
    if (/World Book Day/i.test(e.t)) overrides.push("World Book Day: dress as a book character instead of uniform.");
    if (/Concert|Production|Carol/i.test(e.t)) overrides.push("Concert dress needed this evening: white shirt, school tie, dark skirt or trousers.");
    if (/Sports Day|Sports Morning|pancake/i.test(e.t)) overrides.push("Games kit all day, plus a sun hat.");
    if (/Carol Service|Prize Giving|Open Morning|Harvest|Easter Service/i.test(e.t)) overrides.push("Full uniform with blazer, inspected at registration.");
  }
  return { base, detail: UNIFORM_DETAIL[base], kit: (p?.kit || []).map(k => KIT_TEXT[k]).filter(Boolean), overrides };
}

/* where a kit token is itemised below, the year group's coarse label for the same
   kit is redundant and would be listed twice */
const KIT_COVERS = {
  swim:   /swim|towel|cap|goggles|costume|trunks/i,
  games:  /games kit|games shirt|games shorts|boots|trainers|tracksuit|gum shield/i,
  pe:     /pe kit|plimsolls/i,
  forest: /wellington|old clothes|old trousers|named bag/i

const slug = t => t.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

function checklistFor(child, d) {
  if (!isSchoolDay(d)) return null;
  const base = uniformBase(d), opt = child.uniformOption || "grey";
  const set = UNIFORM_ITEMS[base][opt];
  const p = patternFor(child, d) || { kit: [], bring: [], prep: "" };
  const ev = eventsFor(d, [child.id]);
  const t = termFor(d);
  const banners = [];
  let replaced = false;          /* set where the day displaces uniform altogether */
  let suspended = false;         /* set where the day displaces the timetable too */
  let worn = set.worn.map(x => [x, ""]);
  let carried = set.carried.map(x => [x, ""]);
  let bag = [];

  /* kept apart so that a day which suspends the timetable can drop them wholesale */
  const kitBag = [], bringBag = [], extraBag = [];
  for (const k of p.kit) {
    const items = (KIT_ITEMS[k] || []).map(x => [x, ""]);
    if (k === "games") {
      if (t && t.id === "michaelmas") items.push(["Gum shield", "Compulsory for rugby. They cannot play without one."]);
      if (base === "Winter uniform") items.push(["Tracksuit", "Games are outdoors in Holland Park."]);
    }
    kitBag.push(...items);
  }
  for (const b of p.bring) {
    if (p.kit.some(k => KIT_COVERS[k] && KIT_COVERS[k].test(b))) continue;
    bringBag.push([b, ""]);
  }

  for (const e of ev) {
    if (/photograph/i.test(e.t)) {
      banners.push(["red", "School photographs today",
        "Full uniform with blazer, inspected at registration. Games kit travels in a bag rather than being worn."]);
      if (!worn.concat(carried).some(x => /blazer/i.test(x[0]))) worn.push(["Navy blazer", "Worn for the photograph."]);
    }
    if (/mufti/i.test(e.t)) {
      banners.push(["red", "Mufti Day", "Own clothes and sensible shoes. No uniform at all today."]);
      worn = [["Own clothes", "Sensible shoes, and nothing that cannot get dirty."]];
      replaced = true;
      carried = [];
      extraBag.push(["£2 donation", "Or settle it in the app instead."]);
    }
    if (/World Book Day/i.test(e.t)) {
      banners.push(["red", "World Book Day", "Dressed as a character from a book, in place of uniform."]);
      worn = [["Book character costume", "Nothing bought specially, please."]];
      replaced = true;
      carried = [];
    }
    if (/Sports Day|Sports Morning/i.test(e.t)) {
      banners.push(["amber", e.t, "Games kit all day, and sun cream applied before school. The normal timetable does not run."]);
      worn = KIT_ITEMS.games.map(x => [x, ""]);
      replaced = true;
      suspended = true;
      carried = [["Sun hat", ""], ["Sun cream applied at home", ""]];
    }
    if (e.type === "trip") {
      banners.push(["amber", e.t,
        "Full uniform and sensible shoes. No bag. A packed lunch is provided by the school kitchen."]);
      carried.push(["Sensible walking shoes", "There is a walk at each end."]);
    }
    if (/Concert|Production|Carol Service/i.test(e.t)) {
      banners.push(["amber", `${e.t} this evening`, "Concert dress: white shirt, school tie, dark trousers or skirt."]);
      extraBag.push(["Concert dress", "Changed into before the performance."]);
      if (child.instrument) extraBag.push([child.instrument, "Needed this evening."]);
    }
    if (/Prize Giving|Open Morning|Harvest|Easter Service/i.test(e.t)) {
      banners.push(["amber", e.t, "Full uniform with blazer, inspected at registration."]);
    }
  }

  /* one item may be implied twice; the parent should see it once */
  const dedupe = list => { const seen = new Set(); return list.filter(([l]) => {
    const k = l.toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; }); };
  bag = dedupe([...(suspended ? [] : kitBag), ...(suspended ? [] : bringBag), ...extraBag, ["Water bottle", ""]]);
  const wornK = new Set(worn.concat(carried).map(x => x[0].toLowerCase()));
  bag = bag.filter(([l]) => !wornK.has(l.toLowerCase()));

  const groups = [
    { k: "worn", t: "Worn to school", items: dedupe(worn) },
    { k: "carried", t: "Carried", items: dedupe(carried) },
    { k: "bag", t: "In the bag", items: bag },
    /* no point offering a uniform jumper on a day with no uniform */
    { k: "cool", t: "If it is cold", items: replaced ? [] : set.cool.map(x => [x, ""]), optional: true }
  ].filter(g => g.items.length);

  for (const g of groups) g.items = g.items.map(([l, n]) => ({ id: `${g.k}:${slug(l)}`, label: l, note: n }));
  const required = groups.filter(g => !g.optional).reduce((n, g) => n + g.items.length, 0);
  return { base, groups, banners, required };
}

    if (items.length) out.push({ g: g.g, items });
  }
  return out;
}

function nextSchoolDay(from, inclusive) {
  let x = new Date(from);
  if (!inclusive) x = addDays(x, 1);
  for (let i = 0; i < 220; i++) { if (isSchoolDay(x)) return x; x = addDays(x, 1); }
  return new Date(from);
}

function defaultCheckDate() {
  return (isSchoolDay(TODAY) && new Date().getHours() < 15) ? new Date(TODAY) : nextSchoolDay(TODAY, false);
}

  { k: "lunch", ic: "🍽", t: "Lunch menus", m: "This week and the rotation", body: () => {

    <p>Instrumental lessons are arranged separately with the Director of Music and are taken during the school day on a rotating timetable, so that the same lesson is not missed twice.</p>` },

  { k: "sport", ic: "🏉", t: "Sport and fixtures", m: "Teams, fixtures, results, kit", body: () => {

      <h3>Fixtures</h3><p>Year 4 fixtures are on Thursday afternoons from week two. Each fixture appears in the Diary against your child, with the venue, the kit needed and the expected time back at school. Results are posted the same evening.</p>

/* ============================================================
   9. State
   ============================================================ */
const STORE = "npp.v2";
function load() { try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch { return {}; } }
function save() {
  try { localStorage.setItem(STORE, JSON.stringify({ read: state.read, done: state.done, checks: state.checks, kit: state.kit, prefs: state.prefs, names: state.children.map(c => c.name) })); } catch {}
}
const saved = load();
const state = {
  tab: "today",
  child: "all",
  date: new Date(TODAY),
  diaryMode: "week",
  read: saved.read || {},
  done: saved.done || {},
  checks: saved.checks || {},
  kit: saved.kit || {},
  kitToBuyOnly: false,
  kitChild: "c1",
  checkChild: "c1",
  checkDate: null,
  prefs: saved.prefs || { notices: true, diary: true, sport: true, brief: true, quiet: true },
  children: DEFAULT_CHILDREN.map((c, i) => ({ ...c, name: (saved.names && saved.names[i]) || c.name })),
  sheet: null
};
function activeChildIds() { return state.child === "all" ? state.children.map(c => c.id) : [state.child]; }
const childById = id => state.children.find(c => c.id === id);
const initials = c => c.name.trim()[0].toUpperCase();

const TABS = [
  { k: "today", l: "Today" }, { k: "diary", l: "Diary" }, { k: "notices", l: "Notices" },
  { k: "school", l: "School" }, { k: "family", l: "Family" }
];

function chip(c) {
  return `<button class="chip" data-child="${c.id}" aria-pressed="${state.child === c.id}">
    <span class="pip" style="background:${c.colour}"></span>${esc(c.name)}</button>`;
}
function cardEvent(e, opts = {}) {
  const col = TYPE_COLOUR[e.type] || "var(--faint)";
  const who = e.child ? childById(e.child) : null;
  const meta = [e.where, who ? who.name : (e.years ? `Year ${e.years.join(" & ")}` : (e.scope === "school" ? "Whole school" : ""))]
    .filter(Boolean).join(" · ");
  return `<button class="line tappable" data-ev="${esc(e.t)}|${key(opts.date || state.date)}">
    <span class="rail" style="background:${col}"></span>
    <span class="tm">${e.time || (e.allDay ? "all day" : "–")}</span>
    <span class="bd"><span class="t">${esc(e.t)}</span>${meta ? `<span class="m">${esc(meta)}</span>` : ""}</span>
    ${ICONS.chev}</button>`;
}

/* ============================================================
   11. Views
   ============================================================ */
function viewToday() {
  const d = TODAY, t = termFor(d), ids = activeChildIds();
  const kids = state.children.filter(c => ids.includes(c.id));
  const acts = openActions();
  const hol = nextHoliday(d);
  let h = "";

  h += `<div class="page-h"><h1>${dayLong(d)}</h1><div class="sub">${
    INSET.has(key(d)) ? "INSET day, school closed to pupils" :
    t ? (inHalfTerm(d) ? "Half term" : isWeekend(d) ? "Not a school day"
        : hol.name === "half term" ? `Half term begins ${dayLong(hol.date)}`
        : `Term ends ${dayLong(addDays(hol.date, -1))}`)
      : "School holiday"}</div></div>`;

  /* Things that need a parent */
  if (acts.length) {
    h += `<div class="card action-card"><div class="card-head"><h2>${acts.length} thing${acts.length > 1 ? "s need" : " needs"} you</h2></div>`;
    h += acts.map(n => {
      const days = Math.round((n.action.due - d) / 86400000);
      const late = days < 0;
      return `<button class="action-line" data-notice="${n.id}">
        <span class="pill ${late ? "red" : days <= 2 ? "red" : "plain"}">${late ? "overdue" : days === 0 ? "today" : `${days}d`}</span>
        <span class="bd"><span class="t">${esc(n.title)}</span><span class="m">${esc(n.from)} · ${n.action.label}</span></span>
        ${ICONS.chev}</button>`;
    }).join("");
    h += `</div>`;
  }

  if (!isSchoolDay(d)) {
    const why = INSET.has(key(d)) ? "It is an INSET day, so school is closed to pupils." : !t ? "It is the school holidays." : inHalfTerm(d) ? "It is half term." : "It is the weekend.";
    h += `<div class="card"><div class="card-pad"><div class="display" style="font-size:1.1rem">No school today</div>
      <p style="color:var(--muted);margin-top:5px;font-size:.9rem">${why} ${(() => {
        let n = new Date(d); for (let i = 0; i < 90; i++) { n = addDays(n, 1); if (isSchoolDay(n)) break; }
        return `Next school day is ${dayLong(n)}.`; })()}</p></div>
      <div class="btnrow"><button class="btn ghost sm" data-goto="diary">Look at the diary</button></div></div>`;
  }

  /* One card per child */
  for (const c of kids) {
    const p = patternFor(c, d);
    const ev = eventsFor(d, [c.id]);
    const wear = wearFor(c, d);
    const club = ev.find(e => e.type === "clubs");
    const lunch = lunchFor(d);
    const highlights = ev.filter(e => e.type !== "clubs");

    h += `<div class="card"><div class="child-band">
      <span class="avatar" style="background:${c.colour}">${initials(c)}</span>
      <span class="who"><span class="nm">${esc(c.name)}</span><span class="mt">Year ${c.year} · ${esc(c.form)} · ${esc(c.teacher)}</span></span>
      <button class="linkish" data-childview="${c.id}">Their week ›</button></div>`;

    if (!isSchoolDay(d)) {
      h += `<div class="card-pad" style="color:var(--muted);font-size:.9rem">Nothing at school today.</div></div>`;
      continue;
    }
    h += `<div class="rows">`;
    h += `<button class="row as-btn" data-opencheck="${c.id}" data-checkdate="${key(d)}">
      <span class="k">Wearing</span><span class="v"><strong>${wear.base}</strong>
      ${wear.kit.length ? `<span class="note">${wear.kit.map(esc).join("<br>")}</span>` : ""}
      ${wear.overrides.length ? `<span class="note" style="color:var(--red)">${wear.overrides.map(esc).join("<br>")}</span>` : ""}
      <span class="note" style="color:var(--sky);font-weight:600">Check it off ›</span></span></button>`;

    h += `<div class="row"><span class="k">On today</span><span class="v">${
      highlights.length ? highlights.map(e => `<strong>${esc(e.t)}</strong>${e.time ? ` at ${e.time}` : ""}${e.where ? `, ${esc(e.where)}` : ""}`).join("<br>")
        : "A normal timetable."}${
      p ? `<span class="note">${esc(p.lessons.slice(1, 5).map(l => l[1]).join(" · "))}</span>` : ""}</span></div>`;

    if (p && p.bring.length) h += `<div class="row"><span class="k">Bring</span><span class="v">${p.bring.map(esc).join(", ")}</span></div>`;
    if (lunch) h += `<div class="row"><span class="k">Lunch</span><span class="v">${esc(lunch.main)}<span class="note">Vegetarian: ${esc(lunch.veg)} · ${esc(lunch.pud)}</span></span></div>`;

    h += `<div class="row"><span class="k">After school</span><span class="v">${
      club ? `<strong>${esc(club.t)}</strong> until ${club.time}<span class="note">Collect from ${esc(club.where)}. ${esc(c.collection.replace(/^Collected at [0-9.:apm]+ from the /, "Otherwise collected from the "))}</span>`
        : `${esc(c.collection)}`}</span></div>`;

    if (p && p.prep) h += `<div class="row"><span class="k">Prep</span><span class="v">${esc(p.prep)}</span></div>`;
    h += `</div></div>`;
  }

  /* Whole-school notes and tomorrow */
  const school = eventsFor(d, ids).filter(e => e.scope === "school");
  if (isSchoolDay(d) && school.length) {
    h += `<div class="rubric">Across the school</div><div class="card">${school.map(e => cardEvent(e, { date: d })).join("")}</div>`;
  }

  let n = addDays(d, 1); let guard = 0;
  while (!isSchoolDay(n) && guard++ < 120) n = addDays(n, 1);
  const nEv = eventsFor(n, ids);
  h += `<div class="rubric">${sameDay(n, addDays(d, 1)) ? "Tomorrow" : dayLong(n)}</div><div class="card">`;
  h += `<div class="card-pad" style="font-size:.9rem">${
    kids.map(c => { const w = wearFor(c, n), pp = patternFor(c, n);
      return `<div style="margin-bottom:8px"><strong>${esc(c.name)}:</strong> ${esc(w ? w.base : "–")}${
        w && w.kit.length ? `, plus kit` : ""}${pp && pp.bring.length ? `. Bring ${esc(pp.bring.join(", ").toLowerCase())}` : ""}.</div>`; }).join("")
  }${nEv.filter(e => e.scope !== "child").length ? `<div style="color:var(--muted);margin-top:4px">${nEv.filter(e => e.scope !== "child").map(e => esc(e.t)).join(" · ")}</div>` : ""}</div>
  <div class="btnrow">${kids.map(c => `<button class="btn ghost sm" data-opencheck="${c.id}" data-checkdate="${key(n)}">Check ${esc(c.name)}'s kit</button>`).join("")}</div></div>`;

  h += `<div class="protobar">A prototype. Dates, menus, notices and names are illustrative and generated from today's date, so the app looks live whenever it is opened. Add <code>?date=YYYY-MM-DD</code> to the address to walk through any day of the year.</div>`;
  return h;
}

/* ---------- Diary ---------- */
function viewDiary() {
  const ids = activeChildIds();
  let h = `<div class="page-h"><h1>Diary</h1><div class="sub">${
    state.child === "all" ? "Both children and the whole school" : `${esc(childById(state.child).name)} only`}</div></div>`;
  h += `<div class="seg" role="group">${["day", "week", "month"].map(m =>
    `<button data-mode="${m}" aria-pressed="${state.diaryMode === m}">${m[0].toUpperCase() + m.slice(1)}</button>`).join("")}</div>`;

  const d = state.date;
  const lbl = state.diaryMode === "month" ? `${MONTHS[d.getMonth()]} ${d.getFullYear()}`
    : state.diaryMode === "week" ? `Week of ${dayShort(startOfWeek(d))}` : dayLong(d);
  const t = termFor(d);
  const sub = t ? (inHalfTerm(d) ? `${t.name} · half term` : `${t.name}${termWeek(d) ? ` · week ${termWeek(d)}` : ""}`) : "Holidays";
  h += `<div class="datebar">
    <button class="nav" data-step="-1" aria-label="Previous"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m10 3.5-5 4.5 5 4.5"/></svg></button>
    <div class="lbl">${esc(lbl)}<small>${esc(sub)}</small></div>
    <button class="nav" data-step="1" aria-label="Next"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 3.5 5 4.5-5 4.5"/></svg></button></div>`;

  if (state.diaryMode === "day") h += dayPanel(d, ids, true);
  else if (state.diaryMode === "week") {
    const mon = startOfWeek(d);
    h += `<div class="weekgrid">`;
    for (let i = 0; i < 5; i++) {
      const x = addDays(mon, i), ev = eventsFor(x, ids);
      h += `<div class="daycol${sameDay(x, TODAY) ? " is-today" : ""}"><div class="dh">
        <span class="d">${DAYNAMES[x.getDay()]}</span><span class="n">${x.getDate()} ${MONTHS[x.getMonth()].slice(0, 3)}</span></div>`;
      h += ev.length ? ev.map(e => cardEvent(e, { date: x })).join("")
        : `<div class="empty" style="padding:14px">A normal school day.</div>`;
      h += `</div>`;
    }
    h += `</div>`;
    h += `<div class="rubric">Kit for the week</div><div class="card"><div class="rows">`;
    for (const c of state.children.filter(c => ids.includes(c.id))) {
      const items = [];
      for (let i = 0; i < 5; i++) { const x = addDays(mon, i), p = patternFor(c, x);
        if (isSchoolDay(x) && p && (p.kit.length || p.bring.length)) items.push(`${DOW[x.getDay()]}: ${p.bring.join(", ") || p.kit.join(", ")}`); }
      h += `<div class="row"><span class="k">${esc(c.name)}</span><span class="v" style="font-size:.87rem">${items.length ? items.map(esc).join("<br>") : "Nothing beyond uniform."}</span></div>`;
    }
    h += `</div></div>`;
  } else h += monthPanel(d, ids);

  h += `<div class="rubric">Keeping it in your own diary</div><div class="card"><div class="card-pad" style="font-size:.9rem;color:var(--ink-2)">
    <p>Subscribe once and the school calendar keeps itself up to date in Apple Calendar, Outlook or Google, filtered to your children only. Changes made by the school appear in your diary without anyone copying them across.</p></div>
    <div class="btnrow"><button class="btn sm" data-demo="Calendar subscription">Subscribe to this calendar</button>
    <button class="btn ghost sm" data-demo="Term dates download">Term dates only</button></div></div>`;
  return h;
}

function dayPanel(d, ids, withLessons) {
  const ev = eventsFor(d, ids);
  let h = "";
  if (!isSchoolDay(d)) {
    const t = termFor(d);
    h += `<div class="card"><div class="empty"><div class="big">${INSET.has(key(d)) ? "INSET day" : !t ? "School holiday" : inHalfTerm(d) ? "Half term" : "Not a school day"}</div>
      ${!t ? "Term begins " + dayLong(TERMS.find(x => x.start > d)?.start || TERMS[0].start) : ""}</div></div>`;
    return h;
  }
  h += `<div class="card">${ev.length ? ev.map(e => cardEvent(e, { date: d })).join("") : `<div class="empty">A normal school day. Nothing additional in the diary.</div>`}</div>`;
  if (!withLessons) return h;
  for (const c of state.children.filter(c => ids.includes(c.id))) {
    const p = patternFor(c, d); if (!p) continue;
    const w = wearFor(c, d);
    h += `<div class="rubric">${esc(c.name)}'s day</div><div class="card">
      <div class="row" style="border-bottom:1px solid var(--line-2)"><span class="k">Wearing</span><span class="v">${esc(w.base)}${w.kit.length ? `<span class="note">${w.kit.map(esc).join("<br>")}</span>` : ""}</span></div>`;
    h += p.lessons.map(l => `<div class="line"><span class="tm">${l[0]}</span><span class="bd"><span class="t">${esc(l[1])}</span></span></div>`).join("");
    h += `</div>`;
  }
  return h;
}

function monthPanel(d, ids) {
  const first = new Date(d.getFullYear(), d.getMonth(), 1);
  const gridStart = startOfWeek(first);
  let cells = "";
  for (let i = 0; i < 42; i++) {
    const x = addDays(gridStart, i);
    const out = x.getMonth() !== d.getMonth();
    const ev = isSchoolDay(x) ? eventsFor(x, ids) : [];
    const off = !isSchoolDay(x);
    const dots = [...new Set(ev.filter(e => e.type !== "clubs").map(e => e.type))].slice(0, 3);
    cells += `<button class="cell${out ? " out" : ""}${sameDay(x, TODAY) ? " today" : ""}${sameDay(x, state.date) && !sameDay(x, TODAY) ? " sel" : ""}${off && !out ? " hol" : ""}" data-day="${key(x)}">
      <span class="n">${x.getDate()}</span><span class="dots">${dots.map(t => `<i style="background:${TYPE_COLOUR[t]}"></i>`).join("")}</span></button>`;
    if (i >= 34 && addDays(gridStart, i + 1).getMonth() !== d.getMonth()) break;
  }
  let h = `<div class="month"><div class="dow">${["M","T","W","T","F","S","S"].map(x => `<span>${x}</span>`).join("")}</div><div class="grid">${cells}</div></div>`;
  h += `<div class="rubric">${dayLong(state.date)}</div>` + dayPanel(state.date, ids, false);
  return h;
}

/* ---------- A single child ---------- */
function viewChild(id) {
  const c = childById(id); if (!c) return viewToday();
  const mon = startOfWeek(TODAY);
  let h = `<div class="page-h"><h1>${esc(c.name)}</h1><div class="sub">Year ${c.year} · ${esc(c.form)} · ${esc(c.teacher)} · ${esc(c.house)} House</div></div>`;

  h += `<div class="card"><div class="statgrid">
    <div class="s"><div class="big-num">${c.merits}</div><div class="l">Merits this term</div></div>
    <div class="s"><div class="big-num">${schoolDaysBetween(termFor(TODAY)?.start || TODAY, TODAY)}</div><div class="l">Days in term</div></div>
    <div class="s"><div class="big-num">100%</div><div class="l">Attendance</div></div></div></div>`;

  h += `<div class="rubric">This week</div><div class="card">`;
  for (let i = 0; i < 5; i++) {
    const x = addDays(mon, i), p = patternFor(c, x), ev = eventsFor(x, [c.id]);
    const w = wearFor(c, x);
    const bits = [w ? w.base.replace(" uniform", "") : "–", ...(p ? p.kit.map(k => k === "swim" ? "swimming" : k === "pe" ? "PE kit" : k === "forest" ? "Forest School" : "games kit") : [])];
    h += `<button class="line tappable" data-jump="${key(x)}">
      <span class="tm">${DOW[x.getDay()]}</span>
      <span class="bd"><span class="t">${isSchoolDay(x) ? esc(bits.join(", ")) : "No school"}</span>
      <span class="m">${ev.length ? esc(ev.map(e => e.t).join(" · ")) : p ? esc(p.lessons.slice(2, 5).map(l => l[1]).join(" · ")) : ""}</span></span>
      ${ICONS.chev}</button>`;
  }
  h += `</div>`;

  const clubs = CLUBS[c.id] || {};
  h += `<div class="rubric">After school</div><div class="card"><div class="rows">${
    Object.keys(clubs).length ? Object.entries(clubs).map(([d, cl]) =>
      `<div class="row"><span class="k">${d}</span><span class="v"><strong>${esc(cl.name)}</strong> until ${cl.end}<span class="note">${esc(cl.where)} · ${esc(cl.who)}</span></span></div>`).join("")
    : `<div class="row"><span class="v" style="color:var(--muted)">No clubs this term.</span></div>`}
    <div class="row"><span class="k">Otherwise</span><span class="v">${esc(c.collection)}</span></div></div></div>`;

  h += `<div class="rubric">Prep this week</div><div class="card"><div class="rows">${
    [0,1,2,3,4].map(i => { const x = addDays(mon, i), p = patternFor(c, x);
      return isSchoolDay(x) && p ? `<div class="row"><span class="k">${DOW[x.getDay()]}</span><span class="v">${esc(p.prep)}</span></div>` : ""; }).join("")}</div></div>`;

  h += `<div class="rubric">Music and sport</div><div class="card"><div class="rows">
    <div class="row"><span class="k">Instrument</span><span class="v">${esc(c.instrument)}<span class="note">${c.instrumentDay}sday at ${c.instrumentTime}, withdrawn from the lesson shown in the timetable</span></span></div>
    <div class="row"><span class="k">Games</span><span class="v">${termFor(TODAY) ? SPORT_BY_TERM[termFor(TODAY).id] : "Cricket"}${c.year >= 3 ? ", with fixtures on Thursdays" : ", in Holland Park"}</span></div>
    <div class="row"><span class="k">House</span><span class="v">${esc(c.house)} · ${esc(c.rank)}</span></div></div></div>`;

  h += `<div class="btnrow" style="padding-left:0;padding-right:0"><button class="btn" data-opencheck="${c.id}">Uniform check</button>
    <button class="btn ghost" data-goto="diary">See the full diary</button>
    <button class="btn ghost" data-demo="Report an absence">Report an absence</button></div>`;
  return h;
}

/* ---------- Uniform check ---------- */
function viewCheck() {
  const c = childById(state.checkChild) || state.children[0];
  const d = state.checkDate || defaultCheckDate();
  const a = nextSchoolDay(TODAY, true), b = nextSchoolDay(a, false);
  const labelFor = x => sameDay(x, TODAY) ? "Today" : sameDay(x, addDays(TODAY, 1)) ? "Tomorrow" : DAYNAMES[x.getDay()];
  const list = checklistFor(c, d);
  const store = state.checks[`${c.id}|${key(d)}`] || {};

  let h = `<button class="backlink" data-goto="today">
    <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m10 3.5-5 4.5 5 4.5"/></svg>
    Today</button>`;
  h += `<div class="page-h"><h1>Uniform check</h1><div class="sub">${esc(c.name)} · ${dayLong(d)}</div></div>`;
  h += `<div class="seg" role="group">${[a, b].map(x =>
    `<button data-checkday="${key(x)}" aria-pressed="${sameDay(x, d)}">${labelFor(x)}</button>`).join("")}</div>`;
  h += `<div class="chips" style="padding-left:0;padding-right:0">${state.children.map(k =>
    `<button class="chip" data-checkchild="${k.id}" aria-pressed="${k.id === c.id}">
      <span class="pip" style="background:${k.colour}"></span>${esc(k.name)}</button>`).join("")}</div>`;

  if (!list) {
    h += `<div class="card"><div class="empty"><div class="big">No school that day</div>
      Nothing to pack. The next school day is ${dayLong(nextSchoolDay(d, false))}.</div></div>`;
    return h;
  }

  const done = list.groups.filter(g => !g.optional).reduce((n, g) => n + g.items.filter(i => store[i.id]).length, 0);
  const pct = list.required ? Math.round((done / list.required) * 100) : 100;

  if (list.banners.length) h += `<div class="card" style="margin-top:12px">${list.banners.map(([tone, t, m]) =>
    `<div class="banner ${tone}"><span class="dot"></span><span><span class="t">${esc(t)}</span><span class="m">${esc(m)}</span></span></div>`).join("")}</div>`;

  h += `<div class="card" style="margin-top:12px"><div class="card-head"><h2>${list.base}</h2>
    <span class="tag">${esc(c.uniformOption === "check" ? "Checked dress" : "Shorts and shirt")}</span></div>
    <div class="prog${done === list.required ? " done" : ""}">
      <span class="bar"><i style="width:${pct}%"></i></span>
      <span class="n">${done} of ${list.required}</span></div></div>`;

  for (const g of list.groups) {
    h += `<div class="rubric">${g.t}${g.optional ? " · optional" : ""}</div><div class="card">`;
    h += g.items.map(i => `<button class="chk" data-check="${c.id}|${key(d)}|${i.id}" aria-pressed="${!!store[i.id]}">
      <span class="box"><svg width="12" height="12" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 7.5 5.5 10.5 11.5 3.5"/></svg></span>
      <span class="bd"><span class="t">${esc(i.label)}</span>${i.note ? `<span class="n">${esc(i.note)}</span>` : ""}</span></button>`).join("");
    h += `</div>`;
  }

  h += `<div class="card"><div class="card-pad" style="font-size:.88rem;color:var(--ink-2)">
    ${done === list.required
      ? "<strong>All checked.</strong> Everything named, including the boater and the water bottle."
      : "Everything is to be named, including boaters, caps, water bottles and swimming caps."}</div>
    <div class="btnrow"><button class="btn ghost sm" data-clearcheck="${c.id}|${key(d)}">Start again</button>
    <button class="btn ghost sm" data-openkit="${c.id}">Start of term list</button></div></div>`;
  return h;
}

/* ---------- Start of term kit list ---------- */
function viewKit() {
  const c = childById(state.kitChild) || state.children[0];
  const groups = kitListFor(c);
  const owned = state.kit[c.id] || {};
  const all = groups.flatMap(g => g.items);
  const toBuy = all.filter(i => !owned[i.id]);
  const cost = toBuy.reduce((n, i) => n + i.p * i.q, 0);
  const pct = all.length ? Math.round(((all.length - toBuy.length) / all.length) * 100) : 100;

  let h = `<button class="backlink" data-goto="school">
    <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m10 3.5-5 4.5 5 4.5"/></svg>
    School</button>`;
  h += `<div class="page-h"><h1>Kit list</h1><div class="sub">${esc(c.name)} · Year ${c.year} · everything the school asks for</div></div>`;
  h += `<div class="chips" style="padding-left:0;padding-right:0">${state.children.map(k =>
    `<button class="chip" data-kitchild="${k.id}" aria-pressed="${k.id === c.id}">
      <span class="pip" style="background:${k.colour}"></span>${esc(k.name)}</button>`).join("")}</div>`;

  h += `<div class="card" style="margin-top:12px"><div class="statgrid">
    <div class="s"><div class="big-num">${all.length - toBuy.length}</div><div class="l">In the cupboard</div></div>
    <div class="s"><div class="big-num"${toBuy.length ? ' style="color:var(--red)"' : ""}>${toBuy.length}</div><div class="l">Still to buy</div></div>
    <div class="s"><div class="big-num">${toBuy.length ? "£" + cost.toLocaleString("en-GB") : "—"}</div><div class="l">Indicative</div></div></div>
    <div class="prog${toBuy.length ? "" : " done"}"><span class="bar"><i style="width:${pct}%"></i></span>
    <span class="n">${pct}%</span></div></div>`;

  h += `<div class="seg" role="group">
    <button data-kitfilter="all" aria-pressed="${!state.kitToBuyOnly}">Everything</button>
    <button data-kitfilter="buy" aria-pressed="${state.kitToBuyOnly}">Only what to buy${toBuy.length ? ` (${toBuy.length})` : ""}</button></div>`;

  let shown = 0;
  for (const g of groups) {
    const items = state.kitToBuyOnly ? g.items.filter(i => !owned[i.id]) : g.items;
    if (!items.length) continue;
    shown += items.length;
    h += `<div class="rubric">${g.g}</div><div class="card">`;
    h += items.map(i => `<button class="chk" data-kititem="${c.id}|${i.id}" aria-pressed="${!!owned[i.id]}">
      <span class="box"><svg width="12" height="12" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 7.5 5.5 10.5 11.5 3.5"/></svg></span>
      <span class="bd"><span class="t">${i.q > 1 ? `${i.q} × ` : ""}${esc(i.t)}</span>
        ${i.note ? `<span class="n">${esc(i.note)}</span>` : ""}
        <span class="n" style="display:flex;gap:5px;flex-wrap:wrap;margin-top:5px">
          <span class="pill ${i.w === "outfitter" ? "sky" : "plain"}">${esc(i.w)}</span>
          ${i.sh ? `<span class="pill green">often second-hand</span>` : ""}
          <span class="pill plain">about £${i.p * i.q}</span></span></span></button>`).join("");
    h += `</div>`;
  }
  if (!shown) h += `<div class="card"><div class="empty"><div class="big">Nothing left to buy</div>
    Everything on the school's list is ticked off for ${esc(c.name)}.</div></div>`;

  h += `<div class="rubric">Where to buy it</div><div class="card"><div class="card-pad" style="font-size:.9rem;color:var(--ink-2)">
    <p style="margin:0 0 9px">Anything marked <span class="pill sky">outfitter</span> carries the school's crest or colours and comes from ${esc(OUTFITTER.name)}. The rest is ordinary and can come from anywhere.</p>
    <p style="margin:0">Blazers, boaters, caps, jumpers and tracksuits are worth buying second-hand. The Parents' Association sells them at the start of each term, in good order and a great deal cheaper, and children grow out of them long before they wear out.</p></div>
    <div class="btnrow">
      <a class="btn sm" href="${OUTFITTER.url}" target="_blank" rel="noopener">${esc(OUTFITTER.name)} ↗</a>
      <button class="btn ghost sm" data-demo="Book the second-hand sale">Second-hand sale</button>
      <button class="btn ghost sm" data-copykit="${c.id}">Copy the list</button>
      <button class="btn ghost sm" data-clearkit="${c.id}">Start again</button></div></div>`;
  h += `<div class="footnote">Quantities follow a typical prep school list and the prices are indicative, to give a sense of the total rather than to quote one. ${esc(OUTFITTER.name)} holds the school's own list and its prices.</div>`;
  return h;
}

/* ---------- Search ---------- */
function viewSearch(q) {
  const term = (q || "").trim().toLowerCase();
  let h = `<div class="page-h"><h1>Search</h1><div class="sub">Notices, the diary and the school information</div></div>`;
  h += `<div class="searchbox"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="var(--faint)" stroke-width="1.9" stroke-linecap="round"><circle cx="8.8" cy="8.8" r="5.6"/><path d="M13.2 13.2 17 17"/></svg>
    <input id="q" placeholder="Boater, swimming, half term, Late Stay…" value="${esc(q || "")}" autocomplete="off"></div>`;
  if (term.length < 2) { h += `<div class="empty">Type a word or two. Everything in the app is searchable, including menus and term dates.</div>`; return h; }

  const nres = NOTICES.filter(n => (n.title + " " + n.from + " " + n.body).toLowerCase().includes(term));
  const sres = SCHOOL.filter(s => (s.t + " " + s.m + " " + (s.body ? s.body() : "")).toLowerCase().includes(term));
  const eres = [];
  for (const t of TERMS) for (const e of (TERM_EVENTS[t.id] || [])) if ((e.t + " " + (e.note || "")).toLowerCase().includes(term)) eres.push({ e, t });

  if (!nres.length && !sres.length && !eres.length) h += `<div class="empty"><div class="big">Nothing found</div>Try a different word.</div>`;
  if (sres.length) h += `<div class="rubric">School information</div><div class="card">${sres.map(s =>
    `<button class="idx" data-school="${s.k}"><span class="ic">${s.ic}</span><span class="bd"><span class="t">${esc(s.t)}</span><span class="m">${esc(s.m)}</span></span>${ICONS.chev}</button>`).join("")}</div>`;
  if (nres.length) h += `<div class="rubric">Notices</div><div class="card">${nres.map(n =>
    `<button class="idx" data-notice="${n.id}"><span class="ic">✉️</span><span class="bd"><span class="t">${esc(n.title)}</span><span class="m">${esc(n.from)} · ${dayShort(n.date)}</span></span>${ICONS.chev}</button>`).join("")}</div>`;
  if (eres.length) h += `<div class="rubric">In the calendar</div><div class="card">${eres.slice(0, 10).map(({ e, t }) =>
    `<div class="line"><span class="rail" style="background:${TYPE_COLOUR[e.type]}"></span><span class="tm">${e.time || "–"}</span>
      <span class="bd"><span class="t">${esc(e.t)}</span><span class="m">${t.name}, week ${e.w}, ${e.d}sday</span></span></div>`).join("")}</div>`;
  return h;
}

/* ============================================================
   12. Sheets
   ============================================================ */
function openSheet(title, html) {
  $("#sheet-title").textContent = title;
  $("#sheet-body").innerHTML = html;
  $("#scrim").hidden = false; $("#sheet").hidden = false;
  requestAnimationFrame(() => { $("#scrim").classList.add("on"); $("#sheet").classList.add("on"); });
  document.body.style.overflow = "hidden";
}
function closeSheet() {
  $("#scrim").classList.remove("on"); $("#sheet").classList.remove("on");
  document.body.style.overflow = "";
  setTimeout(() => { $("#scrim").hidden = true; $("#sheet").hidden = true; }, 200);
}
function noticeSheet(id) {
  const n = NOTICES.find(x => x.id === id); if (!n) return;
  state.read[n.id] = true; save();
  const a = n.action, done = a && state.done[n.id];
  let h = `<div class="wrap"><div style="padding:12px 0 4px;color:var(--muted);font-size:.82rem">${esc(n.from)} · ${dayLong(n.date)}</div>
    <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:4px"><span class="pill plain">${esc(n.cat)}</span>${
      n.years ? `<span class="pill sky">Year ${n.years.join(" & ")}</span>` : `<span class="pill plain">Whole school</span>`}</div></div>
    <div class="prose">${n.body}</div>`;
  if (a) {
    h += `<div class="wrap"><div class="card ${done ? "" : "action-card"}"><div class="card-pad">
      ${done ? `<div class="pill green">Done</div><p style="margin-top:7px;font-size:.88rem;color:var(--muted)">Recorded on ${dayLong(TODAY)}. The office has been told.</p>`
        : `<div style="font-size:.9rem;margin-bottom:9px">This needs a reply by <strong>${dayLong(a.due)}</strong>.</div>
           <button class="btn red wide" data-doaction="${n.id}">${esc(a.label)}</button>`}
      </div></div></div>`;
  }
  h += `<div class="wrap"><div class="btnrow" style="padding-left:0;padding-right:0">
    <button class="btn ghost sm" data-demo="Reply to ${esc(n.from)}">Reply</button>
    <button class="btn ghost sm" data-demo="Add to my diary">Add to my diary</button>
    <button class="btn ghost sm" data-demo="Download the attachment">Attachment</button></div></div>`;
  openSheet(n.title, h);
}
function schoolSheet(k) {
  if (k === "kitlist") return go("kit");
  const s = SCHOOL.find(x => x.k === k); if (!s) return;
  openSheet(s.t, `<div class="prose">${s.body()}</div>`);
}
function eventSheet(title, dk) {
  const [y, m, dd] = dk.split("-").map(Number);
  const d = new Date(y, m - 1, dd);
  const e = eventsFor(d, activeChildIds()).find(x => x.t === title);
  if (!e) return;
  const who = e.child ? childById(e.child).name : e.years ? `Year ${e.years.join(" and ")}` : "The whole school";
  let h = `<div class="wrap"><div class="card" style="margin-top:12px"><div class="rows">
    <div class="row"><span class="k">When</span><span class="v">${dayLong(d)}${e.time ? ` at ${e.time}` : ""}</span></div>
    ${e.where ? `<div class="row"><span class="k">Where</span><span class="v">${esc(e.where)}</span></div>` : ""}
    <div class="row"><span class="k">Who</span><span class="v">${esc(who)}</span></div>
    <div class="row"><span class="k">Type</span><span class="v">${TYPE_LABEL[e.type] || e.type}</span></div>
    ${e.note ? `<div class="row"><span class="k">Note</span><span class="v">${esc(e.note)}</span></div>` : ""}
  </div></div>`;
  const kids = state.children.filter(c => activeChildIds().includes(c.id) && (!e.years || e.years.includes(c.year)) && (!e.child || e.child === c.id));
  for (const c of kids) { const w = wearFor(c, d);
    if (w) h += `<div class="rubric">${esc(c.name)} wears</div><div class="card"><div class="card-pad" style="font-size:.9rem">
      <strong>${w.base}.</strong> ${esc(w.detail)}${w.kit.length ? `<div style="margin-top:7px;color:var(--muted)">${w.kit.map(esc).join("<br>")}</div>` : ""}
      ${w.overrides.length ? `<div style="margin-top:7px;color:var(--red)">${w.overrides.map(esc).join("<br>")}</div>` : ""}</div></div>`; }
  h += `<div class="btnrow" style="padding-left:0;padding-right:0"><button class="btn ghost sm" data-demo="Add to my diary">Add to my diary</button>
    <button class="btn ghost sm" data-demo="Tell the office we cannot make it">Tell the office</button></div></div>`;
  openSheet(title, h);
}
function demoSheet(what) {
  openSheet(what, `<div class="prose"><p>This is a prototype, so nothing is sent anywhere. In a working application this would ${esc(what.toLowerCase())}, writing straight to the school's management system so that the office, the form teacher and the register all see the same thing at once.</p>
    <p>The point of putting it here is that a parent should not have to decide whether something is an email, a telephone call or a form. It is one place, and the school decides where it goes.</p></div>
    <div class="wrap"><div class="btnrow" style="padding-left:0;padding-right:0"><button class="btn wide" data-close>Close</button></div></div>`);
}
function renameSheet(id) {
  const c = childById(id); if (!c) return;
  openSheet(`Edit ${c.name}`, `<div class="prose"><p>The prototype ships with illustrative names. Put your own in and everything else follows.</p></div>
    <div class="wrap"><div class="card"><div class="card-pad">
      <label style="font-size:.7rem;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);font-weight:600">First name</label>
      <input id="rn" value="${esc(c.name)}" style="width:100%;margin-top:6px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:1rem">
    </div><div class="btnrow"><button class="btn" data-saverename="${id}">Save</button><button class="btn ghost" data-close>Cancel</button></div></div></div>`);
  setTimeout(() => $("#rn")?.focus(), 260);
}

/* ============================================================
   13. Render and events
   ============================================================ */
let route = { name: "today", arg: null };
function render() {
  const acts = openActions().length;
  const tabsHtml = TABS.map(t => `<button class="tab" data-tab="${t.k}" ${route.name === t.k ? 'aria-current="page"' : ""}>
      ${ICONS[t.k]}<span class="lb">${t.l}</span>${t.k === "notices" && acts ? `<span class="badge">${acts}</span>` : ""}</button>`).join("");
  $("#tabbar").innerHTML = tabsHtml;
  $("#siderail").innerHTML = tabsHtml;

  const showChips = ["today", "diary", "notices"].includes(route.name);
  $("#chipbar").innerHTML = showChips ? `<div class="chips">
      <button class="chip" data-child="all" aria-pressed="${state.child === "all"}">Both</button>
      ${state.children.map(chip).join("")}</div>` : "";

  const v = $("#view");
  v.innerHTML =
    route.name === "today" ? viewToday() :
    route.name === "diary" ? viewDiary() :
    route.name === "notices" ? viewNotices() :
    route.name === "school" ? viewSchool() :
    route.name === "family" ? viewFamily() :
    route.name === "child" ? viewChild(route.arg) :
    route.name === "check" ? viewCheck() :
    route.name === "kit" ? viewKit() :
    route.name === "search" ? viewSearch(route.arg) : viewToday();

  const ut = termFor(TODAY), uh = nextHoliday(TODAY);
  $("#ub-l").textContent = INSET.has(key(TODAY)) ? "INSET day" :
    ut ? (inHalfTerm(TODAY) ? `${ut.name} · half term` : `${ut.name}${termWeek(TODAY) ? ` · week ${termWeek(TODAY)}` : ""}`)
       : `Holidays · ${AY_LABEL}`;
  $("#ub-r").textContent = uh && isSchoolDay(TODAY)
    ? `${schoolDaysBetween(TODAY, uh.date)} days to ${uh.name === "half term" ? "half term" : "the holidays"}`
    : `Founded 1876`;
  if (route.name === "search") { const q = $("#q"); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }
  window.scrollTo({ top: 0 });
}
function go(name, arg) { route = { name, arg: arg ?? null }; render(); }

document.addEventListener("click", ev => {
  const el = t => ev.target.closest(t);
  let n;
  if ((n = el("[data-tab]"))) return go(n.dataset.tab);
  if ((n = el("[data-goto]"))) return go(n.dataset.goto);
  if ((n = el("[data-child]"))) { state.child = n.dataset.child; return render(); }
  if ((n = el("[data-childview]"))) return go("child", n.dataset.childview);
  if ((n = el("[data-mode]"))) { state.diaryMode = n.dataset.mode; return render(); }
  if ((n = el("[data-step]"))) {
    const s = Number(n.dataset.step);
    state.date = state.diaryMode === "month" ? new Date(state.date.getFullYear(), state.date.getMonth() + s, 1)
      : addDays(state.date, state.diaryMode === "week" ? 7 * s : s);
    return render();
  }
  if ((n = el("[data-day]"))) { const [y, m, d] = n.dataset.day.split("-").map(Number); state.date = new Date(y, m - 1, d); return render(); }
  if ((n = el("[data-jump]"))) { const [y, m, d] = n.dataset.jump.split("-").map(Number); state.date = new Date(y, m - 1, d); state.diaryMode = "day"; return go("diary"); }
  if ((n = el("[data-checkchild]"))) { state.checkChild = n.dataset.checkchild; return render(); }
  if ((n = el("[data-checkday]"))) { const [y, m, dd] = n.dataset.checkday.split("-").map(Number);
    state.checkDate = new Date(y, m - 1, dd); return render(); }
  if ((n = el("[data-check]"))) {
    const [cid, dk, iid] = n.dataset.check.split("|");
    const k = `${cid}|${dk}`;
    state.checks[k] = state.checks[k] || {};
    if (state.checks[k][iid]) delete state.checks[k][iid]; else state.checks[k][iid] = true;
    save(); return render();
  }
  if ((n = el("[data-clearcheck]"))) { delete state.checks[n.dataset.clearcheck]; save(); return render(); }
  if ((n = el("[data-opencheck]"))) {
    state.checkChild = n.dataset.opencheck;
    state.checkDate = n.dataset.checkdate ? (([y, m, dd]) => new Date(y, m - 1, dd))(n.dataset.checkdate.split("-").map(Number)) : defaultCheckDate();
    if (!$("#sheet").hidden) { closeSheet(); setTimeout(() => go("check"), 210); return; }
    return go("check");
  }
  if ((n = el("[data-kitchild]"))) { state.kitChild = n.dataset.kitchild; return render(); }
  if ((n = el("[data-kitfilter]"))) { state.kitToBuyOnly = n.dataset.kitfilter === "buy"; return render(); }
  if ((n = el("[data-kititem]"))) {
    const [cid, iid] = n.dataset.kititem.split("|");
    state.kit[cid] = state.kit[cid] || {};
    if (state.kit[cid][iid]) delete state.kit[cid][iid]; else state.kit[cid][iid] = true;
    save(); return render();
  }
  if ((n = el("[data-clearkit]"))) { delete state.kit[n.dataset.clearkit]; save(); return render(); }
  if ((n = el("[data-copykit]"))) {
    const c = childById(n.dataset.copykit), owned = state.kit[c.id] || {};
    const lines = kitListFor(c).flatMap(g => g.items.filter(i => !owned[i.id])
      .map(i => `${i.q > 1 ? i.q + " x " : ""}${i.t}${i.w === "outfitter" ? " (outfitter)" : ""}`));
    const txt = lines.length
      ? `${c.name} — still to buy\n\n${lines.join("\n")}\n\nIndicative total: £${
          kitListFor(c).flatMap(g => g.items).filter(i => !owned[i.id]).reduce((t, i) => t + i.p * i.q, 0)}`
      : `${c.name} — nothing left to buy.`;
    navigator.clipboard?.writeText(txt).then(
      () => openSheet("Copied", `<div class="prose"><p>The list is on the clipboard, ready to send to whoever is doing the shopping.</p><pre style="white-space:pre-wrap;font-size:.85rem;background:var(--paper-2);padding:12px;border-radius:10px">${esc(txt)}</pre></div>`),
      () => openSheet(`${c.name} — still to buy`, `<div class="prose"><pre style="white-space:pre-wrap;font-size:.85rem">${esc(txt)}</pre></div>`));
    return;
  }
  if ((n = el("[data-openkit]"))) {
    state.kitChild = n.dataset.openkit;
    if (!$("#sheet").hidden) { closeSheet(); setTimeout(() => go("kit"), 210); return; }
    return go("kit");
  }
  if ((n = el("[data-notice]"))) return noticeSheet(n.dataset.notice);
  if ((n = el("[data-school]"))) return schoolSheet(n.dataset.school);
  if ((n = el("[data-ev]"))) { const [t, d] = n.dataset.ev.split("|"); return eventSheet(t, d); }
  if ((n = el("[data-demo]"))) return demoSheet(n.dataset.demo);
  if ((n = el("[data-doaction]"))) { state.done[n.dataset.doaction] = true; save(); closeSheet(); return setTimeout(render, 210); }
  if ((n = el("[data-rename]"))) return renameSheet(n.dataset.rename);
  if ((n = el("[data-saverename]"))) {
    const v = ($("#rn")?.value || "").trim();
    if (v) { childById(n.dataset.saverename).name = v; save(); }
    closeSheet(); return setTimeout(render, 210);
  }
  if ((n = el("[data-pref]"))) { state.prefs[n.dataset.pref] = !state.prefs[n.dataset.pref]; save(); return render(); }
  if (el("[data-theme-toggle]")) {
    const cur = document.documentElement.getAttribute("data-theme");
    const dark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
    return;
  }
  if (el("[data-reset]")) { localStorage.removeItem(STORE); location.reload(); return; }
  if (el("[data-close]") || el("#sheet-close") || el("#scrim")) return closeSheet();
  if (el("#btn-search")) return go("search", "");
});
document.addEventListener("input", ev => {
  if (ev.target.id === "q") { route.arg = ev.target.value; const v = $("#view"); const pos = ev.target.selectionStart;
    v.innerHTML = viewSearch(route.arg); const q = $("#q"); if (q) { q.focus(); q.setSelectionRange(pos, pos); } }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

render();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
