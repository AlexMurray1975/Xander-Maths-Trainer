<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xander's Maths Trainer</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Maths Trainer">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FBFAF4">
<meta name="description" content="Year 3 maths practice for Xander, ready for Year 4.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-512.png" sizes="512x512" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBFAF4;
    --grid:#E8EDE4;
    --ink:#25324B;
    --soft:#6B7690;
    --card:#FFFFFF;
    --tick:#D6362B;
    --gold:#F2B33D;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:'Nunito',sans-serif;color:var(--ink);
    background:var(--paper);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:26px 26px;
    min-height:100vh;padding-bottom:48px;
  }
  header{max-width:560px;margin:0 auto;padding:26px 18px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
  header h1{font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.5rem;letter-spacing:.2px;}
  header .sub{font-size:.8rem;color:var(--soft);font-weight:700;}
  .starbadge{
    background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:8px 14px;
    font-family:'Fredoka',sans-serif;font-weight:600;font-size:1.05rem;white-space:nowrap;
    box-shadow:3px 3px 0 rgba(37,50,75,.15);
  }
  main{max-width:560px;margin:0 auto;padding:8px 16px 0;}

  /* ---------- Home ---------- */
  .mixcard{
    width:100%;text-align:left;border:2px solid var(--ink);border-radius:18px;background:var(--ink);color:#fff;
    padding:16px 18px;margin:10px 0 18px;cursor:pointer;font-family:inherit;
    box-shadow:4px 4px 0 rgba(37,50,75,.25);display:flex;justify-content:space-between;align-items:center;gap:10px;
  }
  .mixcard .t{font-family:'Fredoka',sans-serif;font-weight:600;font-size:1.15rem;}
  .mixcard .d{font-size:.8rem;opacity:.85;margin-top:2px;}
  .mixcard .go{font-size:1.5rem;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .topic{
    border:2px solid var(--ink);border-radius:16px;background:var(--card);padding:14px 12px 12px;
    cursor:pointer;text-align:left;font-family:inherit;color:var(--ink);
    box-shadow:3px 3px 0 rgba(37,50,75,.14);position:relative;overflow:hidden;
  }
  .topic::before{content:'';position:absolute;top:0;left:0;right:0;height:8px;background:var(--tc);}
  .topic .emoji{font-size:1.5rem;margin:4px 0 6px;display:block;}
  .topic .name{font-family:'Fredoka',sans-serif;font-weight:600;font-size:.95rem;line-height:1.15;}
  .topic .stats{font-size:.7rem;color:var(--soft);font-weight:700;margin-top:6px;}
  .meter{height:7px;border-radius:5px;background:#EDEFF3;margin-top:6px;overflow:hidden;}
  .meter div{height:100%;background:var(--tc);border-radius:5px;transition:width .3s;}

  /* ---------- Quiz ---------- */
  .quizhead{display:flex;align-items:center;justify-content:space-between;margin:6px 0 12px;}
  .quizhead .topicname{font-family:'Fredoka',sans-serif;font-weight:600;font-size:1.05rem;display:flex;align-items:center;gap:8px;}
  .quizhead .dot{width:14px;height:14px;border-radius:5px;background:var(--tc);display:inline-block;border:2px solid var(--ink);}
  .quit{background:none;border:none;color:var(--soft);font-weight:800;font-size:.8rem;cursor:pointer;text-decoration:underline;font-family:inherit;}
  .progress{display:flex;gap:5px;margin-bottom:14px;}
  .pip{flex:1;height:9px;border-radius:5px;background:#E7E9EE;border:1px solid #D8DCE4;}
  .pip.right{background:#57B36A;border-color:#57B36A;}
  .pip.wrong{background:#E0715F;border-color:#E0715F;}
  .pip.now{background:var(--tc);border-color:var(--ink);}

  .qcard{
    background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:20px 18px;
    box-shadow:4px 4px 0 rgba(37,50,75,.15);
  }
  .qtext{font-family:'Fredoka',sans-serif;font-weight:600;font-size:1.2rem;line-height:1.35;}
  .qvisual{margin:14px auto 2px;text-align:center;}
  .qvisual svg{max-width:170px;height:auto;}
  .bars{display:flex;align-items:flex-end;justify-content:center;gap:16px;height:120px;margin:14px 0 4px;}
  .bars .bwrap{display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end;}
  .bars .bar{width:34px;border:2px solid var(--ink);border-radius:5px 5px 0 0;}
  .bars .blabel{font-size:.75rem;font-weight:800;}
  .picto{margin:14px 0 4px;text-align:center;font-size:1.4rem;letter-spacing:3px;}
  .picto .key{display:block;font-size:.78rem;font-weight:800;color:var(--soft);letter-spacing:0;margin-top:6px;}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;}
  .opt{
    border:2px solid var(--ink);border-radius:13px;background:#fff;padding:14px 8px;min-height:56px;
    font-family:'Fredoka',sans-serif;font-weight:600;font-size:1.05rem;cursor:pointer;color:var(--ink);
    box-shadow:2px 2px 0 rgba(37,50,75,.12);transition:transform .06s;
  }
  .opt:active{transform:scale(.97);}
  .opt.picked{background:#FFF3D6;border-color:var(--gold);box-shadow:2px 2px 0 var(--gold);}
  .opt.correct{background:#DCF2E1;border-color:#57B36A;}
  .opt.incorrect{background:#F9DCD7;border-color:#E0715F;}
  .opt:disabled{cursor:default;opacity:1;}
  .checkrow{margin-top:16px;text-align:center;min-height:64px;}
  .checkhint{font-size:.8rem;color:var(--soft);font-weight:800;margin-bottom:8px;}
  .lockbtn,.nextbtn{
    font-family:'Fredoka',sans-serif;font-weight:600;font-size:1.05rem;color:#fff;
    background:var(--ink);border:2px solid var(--ink);border-radius:13px;padding:12px 28px;cursor:pointer;
    box-shadow:3px 3px 0 rgba(37,50,75,.25);
  }
  .nextbtn{background:var(--tc);color:var(--ink);}
  .mark{
    font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.05rem;margin-bottom:10px;
  }
  .mark.good{color:#2F8C46;}
  .mark.bad{color:var(--tick);}
  .explain{font-size:.88rem;font-weight:700;color:var(--soft);margin-bottom:10px;line-height:1.4;}
  .bigtick{
    position:fixed;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;z-index:9;
  }
  .bigtick span{
    font-size:7rem;color:var(--tick);font-family:'Fredoka',sans-serif;transform:rotate(-12deg);
    text-shadow:2px 2px 0 rgba(255,255,255,.8);animation:stamp .5s ease;
  }
  @keyframes stamp{0%{transform:rotate(-12deg) scale(2.4);opacity:0;}60%{transform:rotate(-12deg) scale(.95);opacity:1;}100%{transform:rotate(-12deg) scale(1);}}
  @media (prefers-reduced-motion:reduce){.bigtick span{animation:none;}}

  /* ---------- Summary ---------- */
  .summary{background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:26px 20px;text-align:center;box-shadow:4px 4px 0 rgba(37,50,75,.15);}
  .summary .big{font-size:3rem;}
  .summary h2{font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.4rem;margin:8px 0 4px;}
  .summary p{font-weight:700;color:var(--soft);font-size:.92rem;margin-bottom:6px;}
  .summary .stickerline{font-size:1.6rem;margin:8px 0;}
  .sumbtns{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap;}
  footer{max-width:560px;margin:20px auto 0;padding:0 18px;text-align:center;font-size:.72rem;color:var(--soft);font-weight:700;line-height:1.5;}
  .reset{background:none;border:none;color:var(--soft);text-decoration:underline;cursor:pointer;font-family:inherit;font-size:.72rem;font-weight:700;margin-top:4px;}
  .hidden{display:none;}

  /* ---------- Parent view ---------- */
  .starbadge{cursor:pointer;user-select:none;-webkit-user-select:none;}
  .pv-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:4px 0 4px;}
  .pv-top h2{font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.4rem;}
  .pv-top .sub{font-size:.78rem;color:var(--soft);font-weight:700;margin-top:2px;}
  .pv-back{background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:9px 13px;font-family:'Fredoka',sans-serif;font-weight:600;font-size:.85rem;color:var(--ink);cursor:pointer;box-shadow:2px 2px 0 rgba(37,50,75,.15);flex-shrink:0;}
  .pv-chip{display:inline-block;background:#EEF3EE;border:1.5px dashed #B9C6BC;color:var(--soft);font-weight:800;font-size:.72rem;border-radius:20px;padding:6px 12px;margin:6px 0 16px;}
  .pv-tiles{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:9px;margin-bottom:20px;}
  .pv-tile{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:11px 6px;text-align:center;box-shadow:3px 3px 0 rgba(37,50,75,.12);}
  .pv-tile .n{font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.35rem;line-height:1;}
  .pv-tile .l{font-size:.62rem;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:var(--soft);margin-top:5px;}
  .pv-sec{font-family:'Fredoka',sans-serif;font-weight:600;font-size:1.05rem;margin:6px 2px 2px;}
  .pv-note{font-size:.76rem;color:var(--soft);font-weight:700;margin:0 2px 12px;}
  .pv-row{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:10px 12px;margin-bottom:8px;box-shadow:2px 2px 0 rgba(37,50,75,.10);display:flex;align-items:center;gap:11px;}
  .pv-row .emo{font-size:1.35rem;width:24px;text-align:center;flex-shrink:0;}
  .pv-row .mid{flex:1;min-width:0;}
  .pv-row .name{font-weight:800;font-size:.92rem;}
  .pv-row .barw{height:8px;border-radius:6px;background:#EDEFF3;margin-top:6px;overflow:hidden;}
  .pv-row .bar{height:100%;border-radius:6px;}
  .pv-row .cnt{font-size:.7rem;color:var(--soft);font-weight:700;margin-top:4px;}
  .pv-row .pct{font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.1rem;flex-shrink:0;width:48px;text-align:right;}
  .pv-flag{display:inline-block;font-size:.6rem;font-weight:800;text-transform:uppercase;letter-spacing:.02em;color:#fff;background:#D0553F;border-radius:9px;padding:2px 6px;margin-left:6px;vertical-align:middle;}
  .pv-sess{background:var(--card);border:2px solid var(--ink);border-radius:14px;box-shadow:2px 2px 0 rgba(37,50,75,.10);overflow:hidden;}
  .pv-sess .s{display:flex;align-items:center;gap:10px;padding:10px 13px;border-bottom:1.5px solid #EEF0F3;}
  .pv-sess .s:last-child{border-bottom:none;}
  .pv-sess .when{font-size:.72rem;color:var(--soft);font-weight:800;width:92px;flex-shrink:0;}
  .pv-sess .what{flex:1;font-weight:800;font-size:.86rem;min-width:0;}
  .pv-sess .score{font-family:'Fredoka',sans-serif;font-weight:700;font-size:.95rem;}
  .pv-sess .st{color:var(--gold);font-weight:800;font-size:.8rem;width:42px;text-align:right;flex-shrink:0;}
  .pv-foot{font-size:.72rem;color:var(--soft);font-weight:700;text-align:center;line-height:1.5;margin-top:20px;}
</style>
</head>
<body>

<header>
  <div>
    <h1 id="title">Xander's Maths Trainer</h1>
    <div class="sub" id="subtitle">Year 4, here we come</div>
  </div>
  <div class="starbadge">⭐ <span id="starCount">0</span></div>
</header>

<main id="main"></main>

<div class="bigtick" id="bigtick"><span id="bigtickChar">✓</span></div>

<footer>
  Answers are marked like a teacher would: check your answer before you lock it in.
  <br><button class="reset" id="resetBtn">Reset all progress</button>
</footer>

<script>
(function(){
'use strict';

/* ================= utilities ================= */
const ri = (a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick = arr=>arr[Math.floor(Math.random()*arr.length)];
const shuffle = arr=>{const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function opts(correct, wrongs){
  const set=[String(correct)];
  for(const w of wrongs){const s=String(w);if(!set.includes(s)&&set.length<4)set.push(s);}
  let guard=0;
  while(set.length<4&&guard++<40){
    const c=Number(correct);
    if(!isNaN(c)){const s=String(c+pick([-1,1,2,-2,10,-10])* (ri(1,3)));if(Number(s)>=0&&!set.includes(s))set.push(s);}
    else break;
  }
  return shuffle(set);
}
const words1to12=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve'];
function numToWords(n){
  const ones=['','one','two','three','four','five','six','seven','eight','nine'];
  const teens=['ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
  const tens=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
  const h=Math.floor(n/100),r=n%100,t=Math.floor(r/10),o=r%10;
  let s=h?ones[h]+' hundred':'';
  if(r){ if(h)s+=' and ';
    if(r<10)s+=ones[r]; else if(r<20)s+=teens[r-10];
    else {s+=tens[t]; if(o)s+='-'+ones[o];}
  }
  return s||'zero';
}
function moneyStr(p){
  const pounds=Math.floor(p/100),pence=p%100;
  if(pounds&&pence)return '£'+pounds+' and '+pence+'p';
  if(pounds)return '£'+pounds;
  return pence+'p';
}
function clockSVG(h,m){
  const hd=((h%12)+m/60)*30, md=m*6;
  let nums='';
  for(let i=1;i<=12;i++){
    const a=(i*30-90)*Math.PI/180;
    nums+='<text x="'+(80+62*Math.cos(a)).toFixed(1)+'" y="'+(84+62*Math.sin(a)).toFixed(1)+'" font-size="13" font-weight="700" text-anchor="middle" fill="#25324B" font-family="Nunito,sans-serif">'+i+'</text>';
  }
  return '<svg viewBox="0 0 160 160" role="img" aria-label="clock face">'+
    '<circle cx="80" cy="80" r="76" fill="#fff" stroke="#25324B" stroke-width="4"/>'+nums+
    '<line x1="80" y1="80" x2="'+(80+34*Math.cos((hd-90)*Math.PI/180)).toFixed(1)+'" y2="'+(80+34*Math.sin((hd-90)*Math.PI/180)).toFixed(1)+'" stroke="#D6362B" stroke-width="6" stroke-linecap="round"/>'+
    '<line x1="80" y1="80" x2="'+(80+52*Math.cos((md-90)*Math.PI/180)).toFixed(1)+'" y2="'+(80+52*Math.sin((md-90)*Math.PI/180)).toFixed(1)+'" stroke="#25324B" stroke-width="4" stroke-linecap="round"/>'+
    '<circle cx="80" cy="80" r="5" fill="#25324B"/></svg>';
}
function timeWords(h,m){
  const hw=words1to12[((h-1)%12)+1], nx=words1to12[(h%12)+1];
  if(m===0)return hw+" o'clock";
  if(m===15)return 'quarter past '+hw;
  if(m===30)return 'half past '+hw;
  if(m===45)return 'quarter to '+nx;
  if(m<30)return m+' minutes past '+hw;
  return (60-m)+' minutes to '+nx;
}

/* ================= question generators ================= */
/* each returns {q, correct, options, visual?, explain} */

const GEN = {

  place(){
    const t=ri(1,5);
    if(t===1){ // value of a digit
      const n=ri(111,987); const s=String(n); const i=ri(0,2); const d=s[i];
      const vals=[Number(d)*100,Number(d)*10,Number(d)];
      const correct=vals[i];
      return {q:'What is the value of the digit '+d+' in '+n+'?',
        correct:String(correct), options:opts(correct,[vals[(i+1)%3],vals[(i+2)%3],Number(d)]),
        explain:'The '+['hundreds','tens','ones'][i]+' column: '+d+' is worth '+correct+'.'};
    }
    if(t===2){ // compare
      let a=ri(100,999),b=ri(100,999); if(a===b)b+=7;
      const correct=a>b?'>':'<';
      return {q:'Which sign goes here?  '+a+'  ?  '+b,
        correct, options:shuffle(['>','<','=']),
        explain:a+' is '+(a>b?'greater':'smaller')+' than '+b+', so '+a+' '+correct+' '+b+'.'};
    }
    if(t===3){ // words
      const n=ri(101,999);
      const w1=numToWords(ri(101,999)), w2=numToWords(ri(101,999));
      return {q:'How do you write '+n+' in words?',
        correct:numToWords(n), options:opts(numToWords(n),[numToWords(n+10>999?n-10:n+10),w1,w2]),
        explain:n+' is '+numToWords(n)+'.'};
    }
    if(t===4){ // counting on
      const step=pick([4,8,50,100]); const start=step*ri(1,6);
      const seq=[start,start+step,start+2*step];
      const correct=start+3*step;
      return {q:'Counting in '+step+'s: '+seq.join(', ')+', ...?',
        correct:String(correct), options:opts(correct,[correct+step,correct-step,correct+(step===4?2:10)]),
        explain:'Add '+step+' each time: '+seq[2]+' + '+step+' = '+correct+'.'};
    }
    // partition
    const n=ri(111,987), h=Math.floor(n/100)*100, te=Math.floor((n%100)/10)*10, o=n%10;
    return {q:n+' = '+h+' + ? + '+o,
      correct:String(te), options:opts(te,[te/10,te+10,h/10]),
      explain:n+' partitions into '+h+' + '+te+' + '+o+'.'};
  },

  addsub(){
    const t=ri(1,4);
    if(t===1){
      const a=ri(120,860),b=ri(6,99);
      return {q:'What is '+a+' + '+b+'?',
        correct:String(a+b), options:opts(a+b,[a+b+10,a+b-10,a+b+1]),
        explain:a+' + '+b+' = '+(a+b)+'. Check it with '+(a+b)+' − '+b+' = '+a+'.'};
    }
    if(t===2){
      const a=ri(150,980),b=ri(14,120), s=a-b;
      return {q:'What is '+a+' − '+b+'?',
        correct:String(s), options:opts(s,[s+10,s-10,s+1]),
        explain:a+' − '+b+' = '+s+'. Check it with '+s+' + '+b+' = '+a+'.'};
    }
    if(t===3){ // inverse check
      const a=ri(200,700),b=ri(30,150), s=a-b;
      return {q:'Which calculation CHECKS that '+a+' − '+b+' = '+s+'?',
        correct:s+' + '+b+' = '+a,
        options:shuffle([s+' + '+b+' = '+a, a+' + '+b+' = '+(a+b), s+' − '+b+' = '+(s-b), b+' + '+a+' = '+(a+b)]),
        explain:'Addition undoes subtraction: '+s+' + '+b+' should take you back to '+a+'.'};
    }
    // estimate
    const a=ri(140,390),b=ri(60,120);
    const ra=Math.round(a/10)*10, rb=Math.round(b/10)*10;
    return {q:'Best ESTIMATE for '+a+' − '+b+'? Use near numbers.',
      correct:ra+' − '+rb,
      options:shuffle([ra+' − '+rb, (ra+100)+' − '+rb, ra+' − '+(rb+100), (ra-100)+' − '+rb]),
      explain:a+' is close to '+ra+' and '+b+' is close to '+rb+'.'};
  },

  tables(){
    const t=ri(1,4), tb=pick([3,4,8]);
    if(t===1){
      const a=ri(2,12);
      return {q:'What is '+a+' × '+tb+'?',
        correct:String(a*tb), options:opts(a*tb,[(a+1)*tb,(a-1)*tb,a*tb+2]),
        explain:a+' × '+tb+' = '+(a*tb)+'.'};
    }
    if(t===2){
      const a=ri(2,12), p=a*tb;
      return {q:'What is '+p+' ÷ '+tb+'?',
        correct:String(a), options:opts(a,[a+1,a-1,a+2]),
        explain:'Because '+a+' × '+tb+' = '+p+', we know '+p+' ÷ '+tb+' = '+a+'.'};
    }
    if(t===3){ // missing number
      const a=ri(2,12);
      return {q:'? × '+tb+' = '+(a*tb),
        correct:String(a), options:opts(a,[a+1,a-1,tb]),
        explain:a+' lots of '+tb+' make '+(a*tb)+'.'};
    }
    // related facts
    const a=ri(2,9);
    return {q:'If '+a+' × '+tb+' = '+(a*tb)+', what is '+(a*10)+' × '+tb+'?',
      correct:String(a*tb*10), options:opts(a*tb*10,[a*tb,a*tb*100,a*tb*10+10]),
      explain:(a*10)+' is ten times bigger, so the answer is ten times bigger: '+(a*tb*10)+'.'};
  },

  fractions(){
    const t=ri(1,5);
    if(t===1){ // fraction of amount
      const d=pick([2,3,4,5,8,10]); const n=ri(2,9)*d;
      const top=pick([1,1,1,2]); const ans=(n/d)*top;
      return {q:'What is '+top+'/'+d+' of '+n+'?',
        correct:String(ans), options:opts(ans,[n/d,ans+d,ans-1]),

/* ================= state ================= */
const KEY='xander-maths-trainer-v1';
const store={
  async get(k){const v=localStorage.getItem(k);return v===null?null:{key:k,value:v};},
  async set(k,v){localStorage.setItem(k,v);return {key:k,value:v};}
};
let state=null;
function freshState(){
  const per={}; TOPICS.forEach(t=>per[t.id]={c:0,w:0});
  return {stars:0, stickers:[], per, sessions:[]};
}
async function loadState(){
  try{const r=await store.get(KEY); state=r?JSON.parse(r.value):freshState();}
  catch(e){state=freshState();}
  // guard against missing topics after updates
  TOPICS.forEach(t=>{if(!state.per[t.id])state.per[t.id]={c:0,w:0};});
  if(!Array.isArray(state.sessions)) state.sessions=[];
}
async function saveState(){
  try{await store.set(KEY,JSON.stringify(state));}catch(e){console.error('save failed',e);}
}

/* weighted topic choice for Mix mode: more errors → more likely */
function weightedTopic(){
  const weights=TOPICS.map(t=>{
    const s=state.per[t.id], total=s.c+s.w;
    if(!total)return 3;                    // untried topics come up
    return 1+ (s.w/total)*4;               // error-heavy topics come up more
  });
  let sum=weights.reduce((a,b)=>a+b,0), r=Math.random()*sum;
  for(let i=0;i<TOPICS.length;i++){ r-=weights[i]; if(r<=0)return TOPICS[i]; }
  return TOPICS[TOPICS.length-1];
}

let round=null;
function startRound(topicId){
  round={topicId, i:0, results:[], starsEarned:0};
  nextQuestion();
}
function nextQuestion(){
  const topic=round.topicId?TOPICS.find(t=>t.id===round.topicId):weightedTopic();
  round.currentTopic=topic;
  round.q=GEN[topic.id]();
  round.pickedIdx=null; round.locked=false;
  renderQuestion();
}
function renderQuestion(){
  setStars();
  const t=round.currentTopic, q=round.q;
  let pips='';
  for(let i=0;i<QUESTIONS_PER_ROUND;i++){
    let cls='pip';
    if(i<round.results.length)cls+=round.results[i]?' right':' wrong';
    else if(i===round.results.length)cls+=' now';
    pips+='<div class="'+cls+'" style="--tc:'+t.color+'"></div>';
  }
  let html='<div class="quizhead" style="--tc:'+t.color+'">'+
    '<div class="topicname"><span class="dot"></span>'+t.emoji+' '+t.name+'</div>'+
    '<button class="quit" id="quitBtn">exit</button></div>'+
    '<div class="progress">'+pips+'</div>'+
    '<div class="qcard" style="--tc:'+t.color+'">'+
      '<div class="qtext">'+q.q+'</div>'+(q.visual||'')+
      '<div class="opts" id="opts">'+
        q.options.map((o,i)=>'<button class="opt" data-i="'+i+'">'+o+'</button>').join('')+
      '</div>'+
      '<div class="checkrow" id="checkrow"><div class="checkhint">Tap an answer to choose it</div></div>'+
    '</div>';
  main.innerHTML=html;
  document.getElementById('quitBtn').addEventListener('click',renderHome);
  main.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>pickOption(Number(b.dataset.i))));
}
function pickOption(i){
  if(round.locked)return;
  round.pickedIdx=i;
  main.querySelectorAll('.opt').forEach((b,j)=>b.classList.toggle('picked',j===i));
  document.getElementById('checkrow').innerHTML=
    '<div class="checkhint">Checked it? Read the question one more time first.</div>'+
    '<button class="lockbtn" id="lockBtn">Lock it in ✓</button>';
  document.getElementById('lockBtn').addEventListener('click',lockAnswer);
}
async function lockAnswer(){
  if(round.locked||round.pickedIdx===null)return;
  round.locked=true;
  const q=round.q, t=round.currentTopic;
  const picked=q.options[round.pickedIdx];
  const isRight=String(picked)===String(q.correct);
  main.querySelectorAll('.opt').forEach((b,j)=>{
    b.disabled=true;
    if(String(q.options[j])===String(q.correct))b.classList.add('correct');
    else if(j===round.pickedIdx)b.classList.add('incorrect');
  });
  round.results.push(isRight);
  if(isRight){round.starsEarned++; state.stars++; state.per[t.id].c++;}
  else state.per[t.id].w++;
  // sticker check
  let newSticker=null;
  if(state.stars>0 && state.stars%STARS_PER_STICKER===0){
    newSticker=STICKERS[state.stickers.length%STICKERS.length];
    state.stickers.push(newSticker);
  }
  await saveState();
  setStars();
  // big animated mark
  const bt=document.getElementById('bigtick');
  document.getElementById('bigtickChar').textContent=isRight?'✓':'✗';
  document.getElementById('bigtickChar').style.color=isRight?'#2F8C46':'var(--tick)';
  bt.style.display='flex';
  setTimeout(()=>{bt.style.display='none';},650);

  const last=round.results.length>=QUESTIONS_PER_ROUND;
  document.getElementById('checkrow').innerHTML=
    '<div class="mark '+(isRight?'good':'bad')+'">'+(isRight?pick(['Spot on!','Nailed it!','Correct!','Great checking!']):'Not this time — the green one is right.')+'</div>'+
    '<div class="explain">'+q.explain+'</div>'+
    (newSticker?'<div class="mark good">🎉 New sticker earned: '+newSticker+'</div>':'')+
    '<button class="nextbtn" id="nextBtn" style="--tc:'+t.color+'">'+(last?'See my score':'Next question ›')+'</button>';
  document.getElementById('nextBtn').addEventListener('click',()=>{ last?renderSummary():nextQuestion(); });
}
function renderSummary(){
  setStars();
  const right=round.results.filter(Boolean).length;
  // log this completed round for the parent view (additive; does not affect scoring)
  if(!round.logged){
    round.logged=true;
    const lt=round.topicId?TOPICS.find(t=>t.id===round.topicId):null;
    state.sessions.unshift({
      t:Date.now(),
      topic:lt?lt.name:'Mix it up',
      emoji:lt?lt.emoji:'🎲',
      right:right, total:QUESTIONS_PER_ROUND, stars:round.starsEarned
    });
    if(state.sessions.length>60) state.sessions.length=60;
    saveState();
  }
  const perfect=right===QUESTIONS_PER_ROUND;
  const face=perfect?'🏆':right>=6?'🌟':right>=4?'💪':'🔁';
  const msg=perfect?'Perfect round! Checking your answers really works.':
    right>=6?'Brilliant work. Nearly a perfect round!':
    right>=4?'Good effort. One more round and you\'ll crack it.':
    'Tricky one! Have another go — the explanations will help.';
  main.innerHTML='<div class="summary">'+
    '<div class="big">'+face+'</div>'+
    '<h2>'+right+' out of '+QUESTIONS_PER_ROUND+'</h2>'+
    '<p>'+msg+'</p>'+
    '<p>⭐ '+round.starsEarned+' stars earned this round</p>'+
    (state.stickers.length?'<div class="stickerline">'+state.stickers.join(' ')+'</div>':'')+
    '<p>'+(((STARS_PER_STICKER-(state.stars%STARS_PER_STICKER))%STARS_PER_STICKER)||STARS_PER_STICKER)+' stars until your next sticker</p>'+
    '<div class="sumbtns">'+
      '<button class="lockbtn" id="againBtn">Play again</button>'+
      '<button class="nextbtn" id="homeBtn" style="--tc:#F2B33D">All topics</button>'+
    '</div></div>';
  document.getElementById('againBtn').addEventListener('click',()=>startRound(round.topicId));
  document.getElementById('homeBtn').addEventListener('click',renderHome);
}

document.getElementById('resetBtn').addEventListener('click',async()=>{
  if(confirm('Reset all stars, stickers and topic progress?')){
    state=freshState(); await saveState(); renderHome();
  }
});

/* ---------- Parent view (hold the star badge to open) ---------- */
function band(pct){ return pct>=80?'#2F8C46':pct>=60?'#C98A1A':'#D0553F'; }
function whenLabel(ts){
  const d=new Date(ts), now=new Date();
  const day=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const diff=Math.round((today-day)/86400000);
  if(diff===0) return 'Today, '+d.toLocaleTimeString('en-GB',{hour:'numeric',minute:'2-digit'});
  if(diff===1) return 'Yesterday';
  if(diff>1 && diff<7) return d.toLocaleDateString('en-GB',{weekday:'short'});
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
}
function renderParentView(){
  const rows=TOPICS.map(t=>{
    const s=state.per[t.id], total=s.c+s.w;
    return {t, c:s.c, total, pct: total?Math.round(s.c/total*100):null};
  }).sort((a,b)=>{
    if(a.pct===null&&b.pct===null) return 0;
    if(a.pct===null) return 1;
    if(b.pct===null) return -1;
    return a.pct-b.pct;
  });
  const totC=TOPICS.reduce((n,t)=>n+state.per[t.id].c,0);
  const totW=TOPICS.reduce((n,t)=>n+state.per[t.id].w,0);
  const totQ=totC+totW, overall=totQ?Math.round(totC/totQ*100):0;

  let h='<div class="pv-top"><div><h2>Parent view</h2><div class="sub">Xander &middot; Year 3 &rarr; Year 4</div></div>'+
    '<button class="pv-back" id="pvBack">&lsaquo; Back</button></div>'+
    '<div class="pv-chip">🔒 Hold the ⭐ badge for 2 seconds to open this</div>'+
    '<div class="pv-tiles">'+
      '<div class="pv-tile"><div class="n">'+state.stars+'</div><div class="l">Stars</div></div>'+
      '<div class="pv-tile"><div class="n">'+state.stickers.length+'</div><div class="l">Stickers</div></div>'+
      '<div class="pv-tile"><div class="n">'+totQ+'</div><div class="l">Questions</div></div>'+
      '<div class="pv-tile"><div class="n">'+overall+'%</div><div class="l">Overall</div></div>'+
    '</div>'+
    '<div class="pv-sec">Accuracy by topic</div>'+
    '<div class="pv-note">Weakest first &mdash; the topics &ldquo;Mix it up&rdquo; gives him more of.</div>';
  rows.forEach(r=>{
    if(r.pct===null){
      h+='<div class="pv-row"><div class="emo">'+r.t.emoji+'</div><div class="mid"><div class="name">'+r.t.name+'</div><div class="cnt">Not tried yet</div></div><div class="pct" style="color:#9AA3B2">–</div></div>';
    } else {
      const col=band(r.pct);
      h+='<div class="pv-row"><div class="emo">'+r.t.emoji+'</div><div class="mid"><div class="name">'+r.t.name+
         (r.pct<60?' <span class="pv-flag">Needs practice</span>':'')+
         '</div><div class="barw"><div class="bar" style="width:'+r.pct+'%;background:'+col+'"></div></div>'+
         '<div class="cnt">'+r.c+' right of '+r.total+'</div></div><div class="pct" style="color:'+col+'">'+r.pct+'%</div></div>';
    }
  });
  h+='<div class="pv-sec" style="margin-top:20px">Recent sessions</div>';
  if(!state.sessions.length){
    h+='<div class="pv-note">No rounds played yet.</div>';
  } else {
    h+='<div class="pv-sess">';
    state.sessions.slice(0,10).forEach(se=>{
      h+='<div class="s"><div class="when">'+whenLabel(se.t)+'</div><div class="what">'+(se.emoji||'')+' '+se.topic+'</div><div class="score">'+se.right+' / '+se.total+'</div><div class="st">+'+se.stars+'★</div></div>';
    });
    h+='</div>';
  }
  h+='<div class="pv-foot">Everything stays on this device &mdash; no accounts, no internet needed.</div>';
  main.innerHTML=h;
  document.getElementById('pvBack').addEventListener('click',renderHome);
}
(function(){
  const badge=document.querySelector('.starbadge');
  if(!badge) return;
  let timer=null;
  const start=function(e){ if(timer)return; timer=setTimeout(function(){timer=null;renderParentView();},2000); };
  const cancel=function(){ if(timer){clearTimeout(timer);timer=null;} };
  badge.addEventListener('touchstart',start,{passive:true});
  badge.addEventListener('touchend',cancel);
  badge.addEventListener('touchmove',cancel);
  badge.addEventListener('touchcancel',cancel);
  badge.addEventListener('mousedown',start);
  badge.addEventListener('mouseup',cancel);
  badge.addEventListener('mouseleave',cancel);
})();

loadState().then(renderHome);
})();
</script>

<script>
/* ---- PWA: offline support + durable storage so progress survives being put away ---- */
(function(){
  // Ask the browser to keep our saved progress and not evict it.
  if(navigator.storage && navigator.storage.persist){
    navigator.storage.persisted().then(function(already){
      if(!already) navigator.storage.persist();
    }).catch(function(){});
  }
  // Register the service worker (only works over http/https, e.g. once installed to the Home Screen).
  if('serviceWorker' in navigator && location.protocol.startsWith('http')){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(err){
        console.warn('Service worker registration failed:', err);
      });
    });
  }
})();
</script>
