<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="42%" cy="34%" r="80%">
      <stop offset="0%" stop-color="#3a2c14"/>
      <stop offset="55%" stop-color="#241a0d"/>
      <stop offset="100%" stop-color="#0d0904"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3cf"/>
      <stop offset="45%" stop-color="#e7c86b"/>
      <stop offset="78%" stop-color="#a9822f"/>
      <stop offset="100%" stop-color="#6d4e18"/>
    </linearGradient>
    <linearGradient id="marble" x1="0.15" y1="0.05" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#fff0cf"/>
      <stop offset="24%" stop-color="#f6e0a0"/>
      <stop offset="50%" stop-color="#e0b03a"/>
      <stop offset="74%" stop-color="#b62534"/>
      <stop offset="100%" stop-color="#7a0f1e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#ffd98a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="196" fill="none" stroke="url(#ring)" stroke-width="14" opacity="0.9"/>
  <circle cx="256" cy="248" r="170" fill="url(#glow)"/>

  <!-- marble knight glyph -->
  <text x="256" y="360" font-family="Georgia, 'Times New Roman', serif" font-size="300"
        text-anchor="middle" fill="url(#marble)" filter="url(#ds)">&#9822;</text>

  <!-- sparkles -->
  <g fill="#fff3cf">
    <path d="M120 150 l8 20 20 8 -20 8 -8 20 -8 -20 -20 -8 20 -8z" opacity="0.9"/>
    <path d="M398 128 l6 15 15 6 -15 6 -6 15 -6 -15 -15 -6 15 -6z" opacity="0.8"/>
    <circle cx="410" cy="330" r="5" opacity="0.85"/>
    <circle cx="112" cy="352" r="4" opacity="0.8"/>
  </g>
</svg>
